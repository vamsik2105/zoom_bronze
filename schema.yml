version: 2

models:
  - name: si_process_audit
    description: "Process audit log for tracking ETL execution"
    columns:
      - name: execution_id
        description: "Unique execution identifier"
      - name: pipeline_name
        description: "Name of the pipeline"
      - name: start_time
        description: "Process start time"
      - name: status
        description: "Process status (SUCCESS/FAILURE)"
              
  - name: si_data_quality_errors
    description: "Data quality error log"
    columns:
      - name: error_id
        description: "Unique error identifier"
      - name: source_table
        description: "Source table name"
      - name: error_type
        description: "Type of data quality error"
          
  - name: si_users
    description: "Silver layer users table with cleaned and validated data"
    columns:
      - name: user_id
        description: "Unique user identifier"
      - name: email
        description: "User email address (validated format)"
      - name: plan_type
        description: "Standardized plan type"
              
  - name: si_meetings
    description: "Silver layer meetings table"
    columns:
      - name: meeting_id
        description: "Unique meeting identifier"
      - name: host_id
        description: "Meeting host user ID"
              
  - name: si_participants
    description: "Silver layer participants table"
    columns:
      - name: participant_id
        description: "Unique participant identifier"
      - name: meeting_id
        description: "Associated meeting ID"
              
  - name: si_feature_usage
    description: "Silver layer feature usage table"
    columns:
      - name: usage_id
        description: "Unique usage identifier"
      - name: feature_name
        description: "Standardized feature name"
              
  - name: si_webinars
    description: "Silver layer webinars table"
    columns:
      - name: webinar_id
        description: "Unique webinar identifier"
      - name: host_id
        description: "Webinar host user ID"
              
  - name: si_support_tickets
    description: "Silver layer support tickets table"
    columns:
      - name: ticket_id
        description: "Unique ticket identifier"
      - name: user_id
        description: "User who created ticket"
              
  - name: si_licenses
    description: "Silver layer licenses table"
    columns:
      - name: license_id
        description: "Unique license identifier"
      - name: license_type
        description: "Standardized license type"
              
  - name: si_billing_events
    description: "Silver layer billing events table"
    columns:
      - name: event_id
        description: "Unique event identifier"
      - name: user_id
        description: "User associated with billing event"
