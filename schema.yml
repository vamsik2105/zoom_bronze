version: 2

sources:
  - name: bronze
    description: "Bronze layer containing raw data from various Zoom systems"
    tables:
      - name: bz_users
        description: "Raw user data from Zoom platform"
        columns:
          - name: user_id
            description: "Unique identifier for users"
          - name: user_name
            description: "User display name"
          - name: email
            description: "User email address"
          - name: company
            description: "User's company name"
          - name: plan_type
            description: "Zoom plan type"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"
            
      - name: bz_meetings
        description: "Raw meeting data"
        columns:
          - name: meeting_id
            description: "Unique meeting identifier"
          - name: host_id
            description: "Meeting host user ID"
          - name: meeting_topic
            description: "Meeting topic/title"
          - name: start_time
            description: "Meeting start time"
          - name: end_time
            description: "Meeting end time"
          - name: duration_minutes
            description: "Meeting duration in minutes"
          - name: load_timestamp
            description: "Record load timestamp"
          - name: update_timestamp
            description: "Record update timestamp"
          - name: source_system
            description: "Source system identifier"
            
      - name: bz_participants
        description: "Raw participant data"
        columns:
          - name: participant_id
            description: "Unique participant identifier"
          - name: meeting_id
            description: "Associated meeting ID"
          - name: user_id
            description: "Participant user ID"
          - name: join_time
            description: "Time participant joined"
          - name: leave_time
            description: "Time participant left"
          - name: load_timestamp
            description: "Record load timestamp"
          - name: update_timestamp
            description: "Record update timestamp"
          - name: source_system
            description: "Source system identifier"
            
      - name: bz_feature_usage
        description: "Raw feature usage data"
        columns:
          - name: usage_id
            description: "Unique usage record identifier"
          - name: meeting_id
            description: "Associated meeting ID"
          - name: feature_name
            description: "Name of feature used"
          - name: usage_count
            description: "Number of times feature was used"
          - name: usage_date
            description: "Date of feature usage"
          - name: load_timestamp
            description: "Record load timestamp"
          - name: update_timestamp
            description: "Record update timestamp"
          - name: source_system
            description: "Source system identifier"
            
      - name: bz_webinars
        description: "Raw webinar data"
        columns:
          - name: webinar_id
            description: "Unique webinar identifier"
          - name: host_id
            description: "Webinar host user ID"
          - name: webinar_topic
            description: "Webinar topic/title"
          - name: start_time
            description: "Webinar start time"
          - name: end_time
            description: "Webinar end time"
          - name: registrants
            description: "Number of registrants"
          - name: load_timestamp
            description: "Record load timestamp"
          - name: update_timestamp
            description: "Record update timestamp"
          - name: source_system
            description: "Source system identifier"
            
      - name: bz_support_tickets
        description: "Raw support ticket data"
        columns:
          - name: ticket_id
            description: "Unique ticket identifier"
          - name: user_id
            description: "User who created ticket"
          - name: ticket_type
            description: "Type of support ticket"
          - name: resolution_status
            description: "Current resolution status"
          - name: open_date
            description: "Date ticket was opened"
          - name: load_timestamp
            description: "Record load timestamp"
          - name: update_timestamp
            description: "Record update timestamp"
          - name: source_system
            description: "Source system identifier"
            
      - name: bz_licenses
        description: "Raw license data"
        columns:
          - name: license_id
            description: "Unique license identifier"
          - name: license_type
            description: "Type of license"
          - name: assigned_to_user_id
            description: "User assigned to license"
          - name: start_date
            description: "License start date"
          - name: end_date
            description: "License end date"
          - name: load_timestamp
            description: "Record load timestamp"
          - name: update_timestamp
            description: "Record update timestamp"
          - name: source_system
            description: "Source system identifier"
            
      - name: bz_billing_events
        description: "Raw billing event data"
        columns:
          - name: event_id
            description: "Unique event identifier"
          - name: user_id
            description: "User associated with billing event"
          - name: event_type
            description: "Type of billing event"
          - name: amount
            description: "Billing amount"
          - name: event_date
            description: "Date of billing event"
          - name: load_timestamp
            description: "Record load timestamp"
          - name: update_timestamp
            description: "Record update timestamp"
          - name: source_system
            description: "Source system identifier"

models:
  - name: si_process_audit
    description: "Process audit log for tracking ETL execution"
    columns:
      - name: execution_id
        description: "Unique execution identifier"
      - name: pipeline_name
        description: "Name of the pipeline"
      - name: start_time
        description: "Process start time"
      - name: status
        description: "Process status (SUCCESS/FAILURE)"
              
  - name: si_data_quality_errors
    description: "Data quality error log"
    columns:
      - name: error_id
        description: "Unique error identifier"
      - name: source_table
        description: "Source table name"
      - name: error_type
        description: "Type of data quality error"
          
  - name: si_users
    description: "Silver layer users table with cleaned and validated data"
    columns:
      - name: user_id
        description: "Unique user identifier"
      - name: email
        description: "User email address (validated format)"
      - name: plan_type
        description: "Standardized plan type"
              
  - name: si_meetings
    description: "Silver layer meetings table"
    columns:
      - name: meeting_id
        description: "Unique meeting identifier"
      - name: host_id
        description: "Meeting host user ID"
              
  - name: si_participants
    description: "Silver layer participants table"
    columns:
      - name: participant_id
        description: "Unique participant identifier"
      - name: meeting_id
        description: "Associated meeting ID"
              
  - name: si_feature_usage
    description: "Silver layer feature usage table"
    columns:
      - name: usage_id
        description: "Unique usage identifier"
      - name: feature_name
        description: "Standardized feature name"
              
  - name: si_webinars
    description: "Silver layer webinars table"
    columns:
      - name: webinar_id
        description: "Unique webinar identifier"
      - name: host_id
        description: "Webinar host user ID"
              
  - name: si_support_tickets
    description: "Silver layer support tickets table"
    columns:
      - name: ticket_id
        description: "Unique ticket identifier"
      - name: user_id
        description: "User who created ticket"
              
  - name: si_licenses
    description: "Silver layer licenses table"
    columns:
      - name: license_id
        description: "Unique license identifier"
      - name: license_type
        description: "Standardized license type"
              
  - name: si_billing_events
    description: "Silver layer billing events table"
    columns:
      - name: event_id
        description: "Unique event identifier"
      - name: user_id
        description: "User associated with billing event"
