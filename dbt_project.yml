name: 'zoom_customer_analytics'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  zoom_customer_analytics:
    bronze:
      +materialized: table
      +pre-hook: "{{ log_audit_start() }}"
      +post-hook: "{{ log_audit_end() }}"
      bz_audit_log:
        +pre-hook: null
        +post-hook: null
