name: 'Zoom_Customer_Analytics'
version: '1.0.0'
config-version: 2

profile: 'zoom_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  Zoom_Customer_Analytics:
    +materialized: table
    silver:
      +materialized: table
    gold:
      +materialized: table
      +post-hook: |
        {% if this.name != 'go_process_audit' %}
        INSERT INTO {{ ref('go_process_audit') }} (
          execution_id, pipeline_name, process_type, start_time, end_time, status,
          records_processed, records_successful, source_system, target_system,
          load_date, update_date
        )
        VALUES (
          '{{ invocation_id }}', '{{ this.name }}', 'DBT_MODEL', 
          '{{ run_started_at }}', CURRENT_TIMESTAMP(), 'SUCCESS',
          (SELECT COUNT(*) FROM {{ this }}), (SELECT COUNT(*) FROM {{ this }}),
          'SILVER', 'GOLD', CURRENT_DATE(), CURRENT_DATE()
        )
        {% endif %}
      +pre-hook: |
        {% if this.name != 'go_process_audit' %}
        INSERT INTO {{ ref('go_process_audit') }} (
          execution_id, pipeline_name, process_type, start_time, status,
          source_system, target_system, load_date, update_date
        )
        VALUES (
          '{{ invocation_id }}', '{{ this.name }}', 'DBT_MODEL',
          '{{ run_started_at }}', 'RUNNING', 'SILVER', 'GOLD',
          CURRENT_DATE(), CURRENT_DATE()
        )
        {% endif %}
