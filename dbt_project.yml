name: 'Zoom_Customer_Analytics'
version: '1.0.0'
config-version: 2

profile: 'zoom_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  Zoom_Customer_Analytics:
    +materialized: table
    staging:
      +materialized: view
    silver:
      +materialized: table
      +pre-hook: |
        {% if this.name != 'sv_process_audit' %}
          INSERT INTO {{ ref('sv_process_audit') }} (
            execution_id, pipeline_name, start_time, status, 
            source_system, target_system, process_type, 
            load_date, update_date
          ) VALUES (
            '{{ invocation_id }}', '{{ this.name }}', CURRENT_TIMESTAMP(), 'RUNNING',
            'BRONZE', 'SILVER', 'ETL',
            CURRENT_DATE(), CURRENT_DATE()
          )
        {% endif %}
      +post-hook: |
        {% if this.name != 'sv_process_audit' %}
          UPDATE {{ ref('sv_process_audit') }}
          SET end_time = CURRENT_TIMESTAMP(),
              status = 'SUCCESS',
              processing_duration_seconds = DATEDIFF('second', start_time, CURRENT_TIMESTAMP()),
              records_processed = (SELECT COUNT(*) FROM {{ this }}),
              records_successful = (SELECT COUNT(*) FROM {{ this }} WHERE record_status = 'active'),
              records_failed = (SELECT COUNT(*) FROM {{ this }} WHERE record_status = 'error')
          WHERE execution_id = '{{ invocation_id }}' AND pipeline_name = '{{ this.name }}'
        {% endif %}
