# # Configuring models
# # Full documentation: https://docs.getdbt.com/docs/configuring-models

# # In dbt, the default materialization for a model is a view. This means, when you run 
# # dbt run or dbt build, all of your models will be built as a view in your data platform. 
# # The configuration below will override this setting for models in the example folder to 
# # instead be materialized as tables. Any models you add to the root of the models folder will 
# # continue to be built as views. These settings can be overridden in the individual model files
# # using the `{{ config(...) }}` macro.

# # models:
# #   Zoom_Customer_Analytics:
# #       +materialized: table
#     # bronze:
#     #   # +schema: bronze 
#     #   +materialized: table
#     #   +tags: ["bronze"]
#     #   +on_schema_change: "sync_all_columns"

#     # silver:
#     #   +schema: silver 
#     #   +materialized: view
#     #   +tags: ["silver"]
#     #   +on_schema_change: "sync_all_columns"

#       # customer_details_brz:
#       #   +pre_hook: "{{ log('Starting bronze layer processing for customer_details', info=true) }}"
#       #   +post_hook: "{{ log('Completed bronze layer processing for customer_details', info=true) }}"
# models:
#   zoom_customer_analytics:
#     bronze:
#       +materialized: table
#       +schema: bronze
#       +tags: ["bronze"]
#       +meta:
#         layer: "bronze"
#         owner: "data_engineering"

#       customer_details_brz:
#         +materialized: table
#         # +post-hook: 
#         #   - "CREATE INDEX IF NOT EXISTS idx_customer_details_brz_customer_id ON {{ this }} (customer_id)"
#         #   - "CREATE INDEX IF NOT EXISTS idx_customer_details_brz_created_date ON {{ this }} (created_date)"
name: 'zoom_customer_analytics'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'zoom_customer_analytics'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
models:
  zoom_customer_analytics:
    # Config indicated by + and applies to all files under models/bronze/
    bronze:
      +materialized: table
      +schema: bronze
      +pre-hook: 
        - "{{ log('Starting bronze layer transformation for ' ~ this.name, info=true) }}"
      +post-hook:
        - "{{ log('Completed bronze layer transformation for ' ~ this.name, info=true) }}"
      +tags: ["bronze", "customer_data"]

# Global configurations
vars:
  # Define global variables
  source_schema: "raw"
  target_schema: "bronze"
  audit_enabled: true

# On-run-start and on-run-end hooks
on-run-start:
  - "{{ log('Starting DBT run for Zoom Customer Analytics', info=true) }}"

on-run-end:
  - "{{ log('Completed DBT run for Zoom Customer Analytics', info=true) }}"