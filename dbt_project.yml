name: 'Zoom_Customer_Analytics'
version: '1.0.0'
config-version: 2

profile: 'Zoom_Customer_Analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  Zoom_Customer_Analytics:
    +materialized: table
    bronze:
      +schema: bronze
      +tags: ["bronze"]
      bz_audit_log:
        +pre-hook: |
          CREATE SEQUENCE IF NOT EXISTS bronze.audit_log_seq START = 1 INCREMENT = 1;
