version: 2

sources:
  - name: raw
    description: "Raw data layer containing unprocessed data from source systems"
    tables:
      - name: orders_raw
        description: "Raw orders data from the source system"
        columns:
          - name: ORDER_ID
            description: "Unique order identifier"
            tests:
              - not_null
              - unique
          - name: CUSTOMER_ID
            description: "Foreign key reference to customer"
            tests:
              - not_null
          - name: PRODUCT_NAME
            description: "Name of the ordered product"
            tests:
              - not_null
          - name: QUANTITY
            description: "Quantity of items ordered"
            tests:
              - not_null
          - name: PRICE
            description: "Price per unit of the product"
            tests:
              - not_null
          - name: ORDER_DATE
            description: "Date when the order was placed"

models:
  - name: brz_orders
    description: "Bronze layer orders table with cleaned and validated data from raw orders"
    columns:
      - name: ORDER_ID
        description: "Unique order identifier - Primary Key"
        data_type: INT
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - not_null
          - unique
          
      - name: CUSTOMER_ID
        description: "Foreign key reference to customer table"
        data_type: INT
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
              
      - name: PRODUCT_NAME
        description: "Name of the ordered product, cleaned and standardized"
        data_type: STRING
        constraints:
          - type: not_null
        tests:
          - not_null
          - dbt_utils.not_empty_string
          
      - name: QUANTITY
        description: "Quantity of items ordered, validated to be positive"
        data_type: INT
        constraints:
          - type: not_null
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              inclusive: true
              
      - name: PRICE
        description: "Price per unit of the product, validated to be non-negative"
        data_type: DECIMAL(10,2)
        constraints:
          - type: not_null
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
              
      - name: ORDER_DATE
        description: "Date when the order was placed, validated to be not in future"
        data_type: DATE
        tests:
          - not_null
          - dbt_utils.accepted_range:
              max_value: "current_date()"
              inclusive: true

    # Table-level tests
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ORDER_ID
            - CUSTOMER_ID
      - row_count_check:
          expected_min_count: 1

    # Model configuration
    config:
      materialized: table
      tags: ['bronze', 'orders', 'daily']
      meta:
        owner: 'data_engineering_team'
        layer: 'bronze'
        refresh_frequency: 'daily'
        data_classification: 'internal'
        
    # Freshness checks
    # freshness:
    #   warn_after: {count: 1, period: day}
    #   error_after: {count: 2, period: day}


## Additional Configuration File (`dbt_project.yml` - Bronze Models Section)
