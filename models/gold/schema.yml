version: 2

models:
  - name: go_process_audit
    description: "Gold layer process audit table for tracking ETL processes"
    columns:
      - name: execution_id
        description: "Unique identifier for process execution"
      - name: pipeline_name
        description: "Name of the data pipeline"
      - name: status
        description: "Process execution status"
        
  - name: go_user_dimension
    description: "Gold layer user dimension table"
    columns:
      - name: user_dim_id
        description: "Surrogate key for user dimension"
      - name: user_id
        description: "Business key - original user ID"
      - name: user_name
        description: "User display name"
      - name: email_address
        description: "User email address"
      - name: user_type
        description: "Categorized user type based on plan"
        
  - name: go_time_dimension
    description: "Gold layer time dimension table"
    columns:
      - name: time_dim_id
        description: "Surrogate key for time dimension"
      - name: date_key
        description: "Date value"
      - name: year_number
        description: "Year number"
      - name: month_name
        description: "Month name"
        
  - name: go_meeting_facts
    description: "Gold layer meeting facts table"
    columns:
      - name: meeting_fact_id
        description: "Surrogate key for meeting facts"
      - name: meeting_id
        description: "Business key - original meeting ID"
      - name: host_id
        description: "Meeting host user ID"
      - name: duration_minutes
        description: "Meeting duration in minutes"
        
  - name: go_participant_facts
    description: "Gold layer participant facts table"
    columns:
      - name: participant_fact_id
        description: "Surrogate key for participant facts"
      - name: meeting_id
        description: "Associated meeting ID"
      - name: participant_id
        description: "Participant identifier"
      - name: attendance_duration
        description: "Duration of attendance in minutes"
        
  - name: go_webinar_facts
    description: "Gold layer webinar facts table"
    columns:
      - name: webinar_fact_id
        description: "Surrogate key for webinar facts"
      - name: webinar_id
        description: "Business key - original webinar ID"
      - name: host_id
        description: "Webinar host user ID"
      - name: registrants_count
        description: "Number of webinar registrants"
        
  - name: go_billing_facts
    description: "Gold layer billing facts table"
    columns:
      - name: billing_fact_id
        description: "Surrogate key for billing facts"
      - name: event_id
        description: "Business key - original event ID"
      - name: user_id
        description: "User associated with billing event"
      - name: amount
        description: "Billing amount"
