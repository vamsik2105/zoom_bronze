version: 2

models:
  - name: go_process_audit
    description: "Audit table for tracking Gold layer transformation processes"
    columns:
      - name: execution_id
        description: "Unique identifier for each execution"
      - name: pipeline_name
        description: "Name of the pipeline being executed"
      - name: process_type
        description: "Type of process (TRANSFORMATION, LOAD, etc.)"
      - name: start_time
        description: "Process start timestamp"
      - name: end_time
        description: "Process end timestamp"
      - name: status
        description: "Process status (STARTED, COMPLETED, FAILED)"
        
  - name: go_user_dimension
    description: "Gold layer user dimension table"
    columns:
      - name: user_dim_id
        description: "Surrogate key for user dimension"
      - name: user_id
        description: "Business key - unique identifier for user"
      - name: user_name
        description: "Name of the user"
      - name: email_address
        description: "Email address of the user"
      - name: user_type
        description: "Type of user account"
      - name: account_status
        description: "Status of user account"
        
  - name: go_organization_dimension
    description: "Gold layer organization dimension table"
    columns:
      - name: organization_dim_id
        description: "Surrogate key for organization dimension"
      - name: organization_id
        description: "Business key - unique identifier for organization"
      - name: organization_name
        description: "Name of the organization"
        
  - name: go_time_dimension
    description: "Gold layer time dimension table"
    columns:
      - name: time_dim_id
        description: "Surrogate key for time dimension"
      - name: date_key
        description: "Date value"
      - name: year_number
        description: "Year number"
      - name: month_number
        description: "Month number"
      - name: day_of_week
        description: "Day of week number"
        
  - name: go_device_dimension
    description: "Gold layer device dimension table"
    columns:
      - name: device_dim_id
        description: "Surrogate key for device dimension"
      - name: device_connection_id
        description: "Device connection identifier"
      - name: device_type
        description: "Type of device"
        
  - name: go_geography_dimension
    description: "Gold layer geography dimension table"
    columns:
      - name: geography_dim_id
        description: "Surrogate key for geography dimension"
      - name: country_code
        description: "Country code"
      - name: country_name
        description: "Country name"
      - name: region_name
        description: "Region name"
