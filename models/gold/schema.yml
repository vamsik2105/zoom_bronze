version: 2

sources:
  - name: silver
    description: "Silver layer tables containing cleaned and standardized data"
    tables:
      - name: si_users
        description: "Silver users table"
        columns:
          - name: user_id
            description: "Unique user identifier"
          - name: user_name
            description: "User display name"
          - name: email
            description: "User email address"
          - name: company
            description: "User company"
          - name: plan_type
            description: "User subscription plan type"
          - name: load_timestamp
            description: "Record load timestamp"
          - name: update_timestamp
            description: "Record update timestamp"
          - name: source_system
            description: "Source system identifier"
          - name: load_date
            description: "Load date"
          - name: update_date
            description: "Update date"
          - name: data_quality_score
            description: "Data quality score"
          - name: record_status
            description: "Record status"
            
      - name: si_meetings
        description: "Silver meetings table"
        columns:
          - name: meeting_id
            description: "Unique meeting identifier"
          - name: host_id
            description: "Meeting host user ID"
          - name: meeting_topic
            description: "Meeting topic/title"
          - name: start_time
            description: "Meeting start timestamp"
          - name: end_time
            description: "Meeting end timestamp"
          - name: duration_minutes
            description: "Meeting duration in minutes"
            
      - name: si_participants
        description: "Silver participants table"
        columns:
          - name: participant_id
            description: "Unique participant identifier"
          - name: meeting_id
            description: "Associated meeting ID"
          - name: user_id
            description: "Participant user ID"
          - name: join_time
            description: "Participant join timestamp"
          - name: leave_time
            description: "Participant leave timestamp"
            
      - name: si_feature_usage
        description: "Silver feature usage table"
        columns:
          - name: usage_id
            description: "Unique usage identifier"
          - name: meeting_id
            description: "Associated meeting ID"
          - name: feature_name
            description: "Feature name"
          - name: usage_count
            description: "Usage count"
          - name: usage_date
            description: "Usage date"
            
      - name: si_webinars
        description: "Silver webinars table"
        columns:
          - name: webinar_id
            description: "Unique webinar identifier"
          - name: host_id
            description: "Webinar host user ID"
          - name: webinar_topic
            description: "Webinar topic/title"
          - name: start_time
            description: "Webinar start timestamp"
          - name: end_time
            description: "Webinar end timestamp"
          - name: registrants
            description: "Number of registrants"
            
      - name: si_support_tickets
        description: "Silver support tickets table"
        columns:
          - name: ticket_id
            description: "Unique ticket identifier"
          - name: user_id
            description: "Ticket creator user ID"
          - name: ticket_type
            description: "Type of support ticket"
          - name: resolution_status
            description: "Ticket resolution status"
          - name: open_date
            description: "Ticket open date"
            
      - name: si_licenses
        description: "Silver licenses table"
        columns:
          - name: license_id
            description: "Unique license identifier"
          - name: license_type
            description: "Type of license"
          - name: assigned_to_user_id
            description: "User ID license is assigned to"
          - name: start_date
            description: "License start date"
          - name: end_date
            description: "License end date"
            
      - name: si_billing_events
        description: "Silver billing events table"
        columns:
          - name: event_id
            description: "Unique billing event identifier"
          - name: user_id
            description: "Associated user ID"
          - name: event_type
            description: "Type of billing event"
          - name: amount
            description: "Billing amount"
          - name: event_date
            description: "Billing event date"

models:
  - name: go_process_audit
    description: "Gold layer process audit table for tracking ETL processes"
    columns:
      - name: execution_id
        description: "Unique execution identifier"
        data_type: varchar(50)
      - name: pipeline_name
        description: "Name of the pipeline or process"
        data_type: varchar(255)
      - name: process_type
        description: "Type of process (e.g., DBT_MODEL)"
        data_type: varchar(100)
      - name: start_time
        description: "Process start timestamp"
        data_type: timestamp_ntz
      - name: end_time
        description: "Process end timestamp"
        data_type: timestamp_ntz
      - name: status
        description: "Process status (RUNNING, SUCCESS, FAILED)"
        data_type: varchar(50)
      - name: source_system
        description: "Source system identifier"
        data_type: varchar(100)
      - name: target_system
        description: "Target system identifier"
        data_type: varchar(100)
        
  - name: go_user_dimension
    description: "Gold layer user dimension table"
    columns:
      - name: user_dim_id
        description: "Surrogate key for user dimension"
        data_type: varchar(50)
        tests:
          - unique
          - not_null
      - name: user_id
        description: "Business key - unique user identifier"
        data_type: varchar(50)
        tests:
          - not_null
      - name: user_name
        description: "User display name"
        data_type: varchar(255)
      - name: email_address
        description: "User email address"
        data_type: varchar(320)
      - name: user_type
        description: "Type of user (Professional, Basic, Enterprise, Standard)"
        data_type: varchar(50)
      - name: account_status
        description: "Account status (Active, Inactive, Unknown)"
        data_type: varchar(50)
      - name: license_type
        description: "Type of license assigned to user"
        data_type: varchar(100)
        
  - name: go_organization_dimension
    description: "Gold layer organization dimension table"
    columns:
      - name: organization_dim_id
        description: "Surrogate key for organization dimension"
        data_type: varchar(50)
        tests:
          - unique
          - not_null
      - name: organization_id
        description: "Business key - unique organization identifier"
        data_type: varchar(50)
      - name: organization_name
        description: "Organization name"
        data_type: varchar(500)
        
  - name: go_time_dimension
    description: "Gold layer time dimension table"
    columns:
      - name: time_dim_id
        description: "Surrogate key for time dimension"
        data_type: varchar(50)
        tests:
          - unique
          - not_null
      - name: date_key
        description: "Date value"
        data_type: date
        tests:
          - not_null
      - name: year_number
        description: "Year number"
        data_type: number
      - name: month_number
        description: "Month number (1-12)"
        data_type: number
      - name: day_name
        description: "Day name (Monday, Tuesday, etc.)"
        data_type: varchar(20)
        
  - name: go_device_dimension
    description: "Gold layer device dimension table"
    columns:
      - name: device_dim_id
        description: "Surrogate key for device dimension"
        data_type: varchar(50)
        tests:
          - unique
          - not_null
      - name: device_type
        description: "Type of device"
        data_type: varchar(100)
      - name: operating_system
        description: "Operating system"
        data_type: varchar(100)
        
  - name: go_geography_dimension
    description: "Gold layer geography dimension table"
    columns:
      - name: geography_dim_id
        description: "Surrogate key for geography dimension"
        data_type: varchar(50)
        tests:
          - unique
          - not_null
      - name: country_code
        description: "Country code"
        data_type: varchar(10)
      - name: country_name
        description: "Country name"
        data_type: varchar(100)
        
  - name: go_meeting_facts
    description: "Gold layer meeting facts table"
    columns:
      - name: meeting_fact_id
        description: "Surrogate key for meeting fact"
        data_type: varchar(50)
        tests:
          - unique
          - not_null
      - name: meeting_id
        description: "Business key - unique meeting identifier"
        data_type: varchar(50)
        tests:
          - not_null
      - name: host_id
        description: "Meeting host user ID"
        data_type: varchar(50)
      - name: start_time
        description: "Meeting start timestamp"
        data_type: timestamp_ntz
      - name: duration_minutes
        description: "Meeting duration in minutes"
        data_type: number
      - name: participant_count
        description: "Number of participants"
        data_type: number
        
  - name: go_participant_facts
    description: "Gold layer participant facts table"
    columns:
      - name: participant_fact_id
        description: "Surrogate key for participant fact"
        data_type: varchar(50)
        tests:
          - unique
          - not_null
      - name: meeting_id
        description: "Associated meeting ID"
        data_type: varchar(50)
        tests:
          - not_null
      - name: participant_id
        description: "Unique participant identifier"
        data_type: varchar(50)
      - name: attendance_duration
        description: "Attendance duration in minutes"
        data_type: number
        
  - name: go_webinar_facts
    description: "Gold layer webinar facts table"
    columns:
      - name: webinar_fact_id
        description: "Surrogate key for webinar fact"
        data_type: varchar(50)
        tests:
          - unique
          - not_null
      - name: webinar_id
        description: "Business key - unique webinar identifier"
        data_type: varchar(50)
        tests:
          - not_null
      - name: host_id
        description: "Webinar host user ID"
        data_type: varchar(50)
      - name: registrants_count
        description: "Number of registrants"
        data_type: number
        
  - name: go_billing_facts
    description: "Gold layer billing facts table"
    columns:
      - name: billing_fact_id
        description: "Surrogate key for billing fact"
        data_type: varchar(50)
        tests:
          - unique
          - not_null
      - name: event_id
        description: "Business key - unique billing event identifier"
        data_type: varchar(50)
        tests:
          - not_null
      - name: user_id
        description: "Associated user ID"
        data_type: varchar(50)
      - name: amount
        description: "Billing amount"
        data_type: number(10,2)
        
  - name: go_usage_facts
    description: "Gold layer usage facts table"
    columns:
      - name: usage_fact_id
        description: "Surrogate key for usage fact"
        data_type: varchar(50)
        tests:
          - unique
          - not_null
      - name: user_id
        description: "Associated user ID"
        data_type: varchar(50)
      - name: usage_date
        description: "Usage date"
        data_type: date
      - name: meeting_count
        description: "Number of meetings"
        data_type: number
        
  - name: go_quality_facts
    description: "Gold layer quality facts table"
    columns:
      - name: quality_fact_id
        description: "Surrogate key for quality fact"
        data_type: varchar(50)
        tests:
          - unique
          - not_null
      - name: meeting_id
        description: "Associated meeting ID"
        data_type: varchar(50)
      - name: audio_quality_score
        description: "Audio quality score"
        data_type: number(3,2)
      - name: video_quality_score
        description: "Video quality score"
        data_type: number(3,2)
