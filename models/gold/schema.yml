version: 2

sources:
  - name: silver_layer
    description: "Silver layer tables containing cleaned and validated data"
    tables:
      - name: si_users
        description: "Silver users table with user information"
        columns:
          - name: user_id
            description: "Unique identifier for user"
          - name: user_name
            description: "User display name"
          - name: email
            description: "User email address"
          - name: plan_type
            description: "User subscription plan type"
          - name: record_status
            description: "Record status (ACTIVE/INACTIVE)"
            
      - name: si_meetings
        description: "Silver meetings table with meeting information"
        columns:
          - name: meeting_id
            description: "Unique identifier for meeting"
          - name: host_id
            description: "Meeting host user ID"
          - name: meeting_topic
            description: "Meeting topic/title"
          - name: start_time
            description: "Meeting start timestamp"
          - name: end_time
            description: "Meeting end timestamp"
          - name: duration_minutes
            description: "Meeting duration in minutes"

models:
  - name: go_process_audit
    description: "Gold layer process audit table for tracking ETL processes"
    columns:
      - name: execution_id
        description: "Unique identifier for process execution"
      - name: pipeline_name
        description: "Name of the data pipeline"
      - name: status
        description: "Process execution status"
        
  - name: go_user_dimension
    description: "Gold layer user dimension table"
    columns:
      - name: user_dim_id
        description: "Surrogate key for user dimension"
      - name: user_id
        description: "Business key - original user ID"
      - name: user_name
        description: "User display name"
      - name: email_address
        description: "User email address"
      - name: user_type
        description: "Categorized user type based on plan"
        
  - name: go_time_dimension
    description: "Gold layer time dimension table"
    columns:
      - name: time_dim_id
        description: "Surrogate key for time dimension"
      - name: date_key
        description: "Date value"
      - name: year_number
        description: "Year number"
      - name: month_name
        description: "Month name"
        
  - name: go_meeting_facts
    description: "Gold layer meeting facts table"
    columns:
      - name: meeting_fact_id
        description: "Surrogate key for meeting facts"
      - name: meeting_id
        description: "Business key - original meeting ID"
      - name: host_id
        description: "Meeting host user ID"
      - name: duration_minutes
        description: "Meeting duration in minutes"
