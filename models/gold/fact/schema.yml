version: 2

models:
  - name: go_meeting_facts
    description: "Gold layer fact table containing meeting analytics and metrics"
    columns:
      - name: meeting_fact_id
        description: "Unique identifier for meeting fact record"
        tests:
          - unique
          - not_null
      - name: meeting_id
        description: "Meeting identifier from source system"
        tests:
          - not_null
      - name: host_id
        description: "User ID of the meeting host"
      - name: meeting_topic
        description: "Topic or title of the meeting"
      - name: start_time
        description: "Meeting start timestamp in UTC"
      - name: end_time
        description: "Meeting end timestamp in UTC"
      - name: duration_minutes
        description: "Meeting duration in minutes"
      - name: participant_count
        description: "Total number of participants"
      - name: engagement_score
        description: "Calculated engagement score based on interactions"

  - name: go_participant_facts
    description: "Gold layer fact table containing participant analytics"
    columns:
      - name: participant_fact_id
        description: "Unique identifier for participant fact record"
        tests:
          - unique
          - not_null
      - name: meeting_id
        description: "Meeting identifier"
        tests:
          - not_null
      - name: participant_id
        description: "Unique participant identifier"
      - name: user_id
        description: "User identifier for the participant"
      - name: attendance_duration
        description: "Duration of participant attendance in minutes"

  - name: go_webinar_facts
    description: "Gold layer fact table containing webinar analytics"
    columns:
      - name: webinar_fact_id
        description: "Unique identifier for webinar fact record"
        tests:
          - unique
          - not_null
      - name: webinar_id
        description: "Webinar identifier from source system"
        tests:
          - not_null
      - name: host_id
        description: "User ID of the webinar host"
      - name: attendance_rate
        description: "Percentage of registered attendees who actually attended"

  - name: go_billing_facts
    description: "Gold layer fact table containing billing and financial data"
    columns:
      - name: billing_fact_id
        description: "Unique identifier for billing fact record"
        tests:
          - unique
          - not_null
      - name: event_id
        description: "Billing event identifier"
        tests:
          - not_null
      - name: user_id
        description: "User associated with billing event"
      - name: amount
        description: "Billing amount in USD"

  - name: go_usage_facts
    description: "Gold layer fact table containing user usage metrics"
    columns:
      - name: usage_fact_id
        description: "Unique identifier for usage fact record"
        tests:
          - unique
          - not_null
      - name: user_id
        description: "User identifier"
        tests:
          - not_null
      - name: usage_date
        description: "Date of usage activity"
      - name: meeting_count
        description: "Number of meetings hosted on this date"

  - name: go_quality_facts
    description: "Gold layer fact table containing quality and performance metrics"
    columns:
      - name: quality_fact_id
        description: "Unique identifier for quality fact record"
        tests:
          - unique
          - not_null
      - name: meeting_id
        description: "Meeting identifier"
        tests:
          - not_null
      - name: participant_id
        description: "Participant identifier"
      - name: audio_quality_score
        description: "Audio quality score (0-10)"
      - name: video_quality_score
        description: "Video quality score (0-10)"
