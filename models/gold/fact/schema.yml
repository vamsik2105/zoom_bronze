version: 2

models:
  - name: go_meeting_facts
    description: "Gold layer fact table containing meeting analytics and metrics"
    columns:
      - name: meeting_fact_id
        description: "Unique identifier for meeting fact record"
        data_type: varchar(50)
      - name: meeting_id
        description: "Meeting identifier from source system"
        data_type: varchar(50)
      - name: host_id
        description: "Host user identifier"
        data_type: varchar(50)
      - name: meeting_topic
        description: "Meeting topic or subject"
        data_type: varchar(500)
      - name: start_time
        description: "Meeting start timestamp in UTC"
        data_type: timestamp_ntz
      - name: end_time
        description: "Meeting end timestamp in UTC"
        data_type: timestamp_ntz
      - name: duration_minutes
        description: "Meeting duration in minutes"
        data_type: number
      - name: participant_count
        description: "Total number of participants"
        data_type: number
      - name: max_concurrent_participants
        description: "Maximum concurrent participants"
        data_type: number
      - name: total_attendance_minutes
        description: "Total attendance minutes across all participants"
        data_type: number
      - name: average_attendance_duration
        description: "Average attendance duration per participant"
        data_type: number
      - name: meeting_type
        description: "Meeting type classification"
        data_type: varchar(50)
      - name: meeting_status
        description: "Meeting status"
        data_type: varchar(50)
      - name: recording_enabled
        description: "Whether recording was enabled"
        data_type: boolean
      - name: screen_share_count
        description: "Number of screen sharing sessions"
        data_type: number
      - name: chat_message_count
        description: "Number of chat messages"
        data_type: number
      - name: breakout_room_count
        description: "Number of breakout rooms used"
        data_type: number
      - name: quality_score_avg
        description: "Average quality score"
        data_type: number(5,2)
      - name: engagement_score
        description: "Calculated engagement score"
        data_type: number(5,2)
      - name: load_date
        description: "Date when record was loaded"
        data_type: date
      - name: update_date
        description: "Date when record was last updated"
        data_type: date
      - name: source_system
        description: "Source system identifier"
        data_type: varchar(100)

  - name: go_participant_facts
    description: "Gold layer fact table containing participant analytics and metrics"
    columns:
      - name: participant_fact_id
        description: "Unique identifier for participant fact record"
        data_type: varchar(50)
      - name: meeting_id
        description: "Meeting identifier"
        data_type: varchar(50)
      - name: participant_id
        description: "Participant identifier"
        data_type: varchar(50)
      - name: user_id
        description: "User identifier"
        data_type: varchar(50)
      - name: join_time
        description: "Participant join timestamp in UTC"
        data_type: timestamp_ntz
      - name: leave_time
        description: "Participant leave timestamp in UTC"
        data_type: timestamp_ntz
      - name: attendance_duration
        description: "Attendance duration in minutes"
        data_type: number
      - name: participant_role
        description: "Participant role (Host/Participant)"
        data_type: varchar(50)
      - name: audio_connection_type
        description: "Audio connection type"
        data_type: varchar(50)
      - name: video_enabled
        description: "Whether video was enabled"
        data_type: boolean
      - name: screen_share_duration
        description: "Screen sharing duration"
        data_type: number
      - name: chat_messages_sent
        description: "Number of chat messages sent"
        data_type: number
      - name: interaction_count
        description: "Total interaction count"
        data_type: number
      - name: connection_quality_rating
        description: "Connection quality rating"
        data_type: number(3,2)
      - name: device_type
        description: "Device type used"
        data_type: varchar(100)
      - name: geographic_location
        description: "Geographic location"
        data_type: varchar(100)
      - name: load_date
        description: "Date when record was loaded"
        data_type: date
      - name: update_date
        description: "Date when record was last updated"
        data_type: date
      - name: source_system
        description: "Source system identifier"
        data_type: varchar(100)

  - name: go_webinar_facts
    description: "Gold layer fact table containing webinar analytics and metrics"
    columns:
      - name: webinar_fact_id
        description: "Unique identifier for webinar fact record"
        data_type: varchar(50)
      - name: webinar_id
        description: "Webinar identifier"
        data_type: varchar(50)
      - name: host_id
        description: "Host user identifier"
        data_type: varchar(50)
      - name: webinar_topic
        description: "Webinar topic or subject"
        data_type: varchar(500)
      - name: start_time
