      - name: load_date
        description: "Date when record was loaded"
      - name: update_date
        description: "Date when record was last updated"
      - name: source_system
        description: "Source system identifier"
  
  - name: go_usage_facts
    description: "Gold layer fact table for usage analytics"
    columns:
      - name: usage_fact_id
        description: "Unique identifier for usage facts"
        tests:
          - not_null
          - unique
      - name: user_id
        description: "User identifier"
        tests:
          - not_null
      - name: organization_id
        description: "Organization identifier"
      - name: usage_date
        description: "Date of usage"
        tests:
          - not_null
      - name: meeting_count
