version: 2

sources:
  - name: silver
    description: "Silver layer tables containing cleaned and standardized data"
    tables:
      - name: si_users
        description: "Silver users table with user information"
        columns:
          - name: user_id
            description: "Unique identifier for users"
            tests:
              - not_null
              - unique
          - name: user_name
            description: "User display name"
          - name: email
            description: "User email address"
          - name: company
            description: "User company/organization"
          - name: plan_type
            description: "User subscription plan type"
      
      - name: si_meetings
        description: "Silver meetings table with meeting information"
        columns:
          - name: meeting_id
            description: "Unique identifier for meetings"
            tests:
              - not_null
              - unique
          - name: host_id
            description: "Meeting host user ID"
          - name: meeting_topic
            description: "Meeting topic/title"
          - name: start_time
            description: "Meeting start timestamp"
          - name: end_time
            description: "Meeting end timestamp"
          - name: duration_minutes
            description: "Meeting duration in minutes"
      
      - name: si_participants
        description: "Silver participants table with participant information"
        columns:
          - name: participant_id
            description: "Unique identifier for participants"
            tests:
              - not_null
          - name: meeting_id
            description: "Associated meeting ID"
          - name: user_id
            description: "Participant user ID"
          - name: join_time
            description: "Participant join timestamp"
          - name: leave_time
            description: "Participant leave timestamp"
      
      - name: si_feature_usage
        description: "Silver feature usage table"
        columns:
          - name: usage_id
            description: "Unique identifier for usage records"
            tests:
              - not_null
          - name: meeting_id
            description: "Associated meeting ID"
          - name: feature_name
            description: "Name of the feature used"
          - name: usage_count
            description: "Count of feature usage"
          - name: usage_date
            description: "Date of feature usage"
      
      - name: si_webinars
        description: "Silver webinars table"
        columns:
          - name: webinar_id
            description: "Unique identifier for webinars"
            tests:
              - not_null
              - unique
          - name: host_id
            description: "Webinar host user ID"
          - name: webinar_topic
            description: "Webinar topic/title"
          - name: start_time
            description: "Webinar start timestamp"
          - name: end_time
            description: "Webinar end timestamp"
          - name: registrants
            description: "Number of webinar registrants"
      
      - name: si_support_tickets
        description: "Silver support tickets table"
        columns:
          - name: ticket_id
            description: "Unique identifier for support tickets"
            tests:
              - not_null
              - unique
          - name: user_id
            description: "User who created the ticket"
          - name: ticket_type
            description: "Type of support ticket"
          - name: resolution_status
            description: "Current status of the ticket"
          - name: open_date
            description: "Date ticket was opened"
      
      - name: si_licenses
        description: "Silver licenses table"
        columns:
          - name: license_id
            description: "Unique identifier for licenses"
            tests:
              - not_null
              - unique
          - name: license_type
            description: "Type of license"
          - name: assigned_to_user_id
            description: "User ID license is assigned to"
          - name: start_date
            description: "License start date"
          - name: end_date
            description: "License end date"
      
      - name: si_billing_events
        description: "Silver billing events table"
        columns:
          - name: event_id
            description: "Unique identifier for billing events"
            tests:
              - not_null
              - unique
          - name: user_id
            description: "User associated with billing event"
          - name: event_type
            description: "Type of billing event"
          - name: amount
            description: "Billing amount"
          - name: event_date
            description: "Date of billing event"

models:
  - name: go_meeting_facts
    description: "Gold layer fact table for meeting analytics"
    columns:
      - name: meeting_fact_id
        description: "Unique identifier for meeting facts"
        tests:
          - not_null
          - unique
      - name: meeting_id
        description: "Meeting identifier"
        tests:
          - not_null
      - name: host_id
        description: "Meeting host identifier"
      - name: meeting_topic
        description: "Meeting topic/title"
      - name: start_time
        description: "Meeting start timestamp in UTC"
      - name: end_time
        description: "Meeting end timestamp in UTC"
      - name: duration_minutes
        description: "Meeting duration in minutes"
      - name: participant_count
        description: "Total number of participants"
      - name: max_concurrent_participants
        description: "Maximum concurrent participants"
      - name: total_attendance_minutes
        description: "Total attendance minutes across all participants"
      - name: average_attendance_duration
        description: "Average attendance duration per participant"
      - name: meeting_type
        description: "Categorized meeting type based on duration"
      - name: meeting_status
        description: "Current status of the meeting"
      - name: recording_enabled
        description: "Whether recording was enabled"
      - name: screen_share_count
        description: "Number of screen sharing instances"
      - name: chat_message_count
        description: "Number of chat messages"
      - name: breakout_room_count
        description: "Number of breakout rooms used"
      - name: quality_score_avg
        description: "Average quality score for the meeting"
      - name: engagement_score
        description: "Calculated engagement score"
      - name: load_date
        description: "Date when record was loaded"
      - name: update_date
        description: "Date when record was last updated"
      - name: source_system
        description: "Source system identifier"
  
  - name: go_participant_facts
    description: "Gold layer fact table for participant analytics"
    columns:
      - name: participant_fact_id
        description: "Unique identifier for participant facts"
        tests:
          - not_null
          - unique
      - name: meeting_id
        description: "Associated meeting identifier"
        tests:
          - not_null
      - name: participant_id
        description: "Participant identifier"
        tests:
          - not_null
      - name: user_id
        description: "User identifier for the participant"
      - name: join_time
        description: "Participant join timestamp in UTC"
      - name: leave_time
        description: "Participant leave timestamp in UTC"
      - name: attendance_duration
        description: "Duration of participant attendance in minutes"
      - name: participant_role
        description: "Role of participant (Host/Participant)"
      - name: audio_connection_type
        description: "Type of audio connection used"
      - name: video_enabled
        description: "Whether video was enabled"
      - name: screen_share_duration
        description: "Duration of screen sharing"
      - name: chat_messages_sent
        description: "Number of chat messages sent"
      - name: interaction_count
        description: "Total interaction count"
      - name: connection_quality_rating
        description: "Connection quality rating"
      - name: device_type
        description: "Type of device used"
      - name: geographic_location
        description: "Geographic location of participant"
      - name: load_date
        description: "Date when record was loaded"
      - name: update_date
        description: "Date when record was last updated"
      - name: source_system
        description: "Source system identifier"
  
  - name: go_webinar_facts
    description: "Gold layer fact table for webinar analytics"
    columns:
      - name: webinar_fact_id
        description: "Unique identifier for webinar facts"
        tests:
          - not_null
          - unique
      - name: webinar_id
        description: "Webinar identifier"
        tests:
          - not_null
      - name: host_id
        description: "Webinar host identifier"
      - name: webinar_topic
        description: "Webinar topic/title"
      - name: start_time
        description: "Webinar start timestamp in UTC"
      - name: end_time
        description: "Webinar end timestamp in UTC"
      - name: duration_minutes
        description: "Webinar duration in minutes"
      - name: registrants_count
        description: "Number of registrants"
      - name: actual_attendees
        description: "Number of actual attendees"
      - name: attendance_rate
        description: "Attendance rate percentage"
      - name: max_concurrent_attendees
        description: "Maximum concurrent attendees"
      - name: qa_questions_count
        description: "Number of Q&A questions"
      - name: poll_responses_count
        description: "Number of poll responses"
      - name: engagement_score
        description: "Calculated engagement score"
      - name: event_category
        description: "Categorized event type based on duration"
      - name: load_date
        description: "Date when record was loaded"
      - name: update_date
        description: "Date when record was last updated"
      - name: source_system
        description: "Source system identifier"
  
  - name: go_billing_facts
    description: "Gold layer fact table for billing analytics"
    columns:
      - name: billing_fact_id
        description: "Unique identifier for billing facts"
        tests:
          - not_null
          - unique
      - name: event_id
        description: "Billing event identifier"
        tests:
          - not_null
      - name: user_id
        description: "User identifier"
