#     schema: RAW
#     tables: 
#     - name: customer_details
#   - name: bronze
#     database: ZOOM
#     schema: BRONZE
#    tables: 
#    - name: customer_details_brz

version: 2

sources:
  - name: raw
    description: "Raw data layer containing unprocessed customer information"
    schema: raw
    tables:
      - name: customer_details
        description: "Raw customer details from source systems"
        columns:
          - name: customer_id
            description: "Unique identifier for the customer"
            tests:
              - not_null
              - unique

          - name: customer_name
            description: "Name of the customer"
            tests:
              - not_null

          - name: email
            description: "Email address of the customer"

          - name: created_date
            description: "Date the customer record was created"

models:
  - name: customer_details_brz
    description: "Bronze layer customer details with data quality validation and audit trail"
    columns:
      - name: customer_id
        description: "Unique identifier for the customer (Primary Key)"
        tests:
          - not_null
          - unique
        meta:
          data_type: "INT"
          source_column: "customer_id"
          transformation: "1:1 mapping"

      - name: customer_name
        description: "Cleaned and trimmed customer name"
        tests:
          - not_null
        meta:
          data_type: "STRING"
          source_column: "customer_name"
          transformation: "1:1 mapping with TRIM function"

      - name: email
        description: "Standardized email address (lowercase, trimmed)"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 320
              field: "LENGTH(email)"
              condition: "email IS NOT NULL"
        meta:
          data_type: "STRING"
          source_column: "email"
          transformation: "1:1 mapping with standardization (lowercase, trim)"

      - name: created_date
        description: "Date the customer record was originally created"
        tests:
          - dbt_utils.expression_is_true:
              expression: "<= current_date()"
              condition: "created_date IS NOT NULL"
        meta:
          data_type: "DATE"
          source_column: "created_date"
          transformation: "1:1 mapping"

      - name: data_quality_status
        description: "Data quality validation status (VALID, INVALID_NAME, INVALID_EMAIL, FUTURE_DATE)"
        tests:
          - accepted_values:
              values: ['VALID', 'INVALID_NAME', 'INVALID_EMAIL', 'FUTURE_DATE']
        meta:
          data_type: "STRING"
          source_column: "derived"
          transformation: "Quality check derived field"

      - name: bronze_created_at
        description: "Timestamp when record was first processed into bronze layer"
        tests:
          - not_null
        meta:
          data_type: "TIMESTAMP"
          source_column: "system_generated"
          transformation: "Audit column - processing timestamp"

      - name: bronze_updated_at
        description: "Timestamp when record was last updated in bronze layer"
        tests:
          - not_null
        meta:
          data_type: "TIMESTAMP"
          source_column: "system_generated"
          transformation: "Audit column - last update timestamp"

      - name: batch_id
        description: "Unique identifier for the processing batch/run"
        tests:
          - not_null
        meta:
          data_type: "STRING"
          source_column: "system_generated"
          transformation: "Audit column - DBT invocation ID"

      - name: process_status
        description: "Overall processing status (SUCCESS, WARNING, ERROR)"
        tests:
          - accepted_values:
              values: ['SUCCESS', 'WARNING', 'ERROR']
        meta:
          data_type: "STRING"
          source_column: "derived"
          transformation: "Process status derived from data quality checks"

    tests:
      - dbt_utils.expression_is_true:
          expression: "bronze_updated_at >= bronze_created_at"
          name: "bronze_timestamps_logical_order"

    meta:
      owner: "Data Engineering Team"
      layer: "bronze"
      refresh_frequency: "daily"
      data_classification: "internal"
      retention_days: 2555 # 7 years
