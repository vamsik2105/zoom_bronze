version: 2

sources:
  - name: raw
    schema: raw
    description: "Raw data layer containing unprocessed customer information"
    tables:
      - name: customer_details
        description: "Raw customer details from source systems"
        columns:
          - name: customer_id
            description: "Unique identifier for the customer"
            tests:
              - not_null
              - unique
          - name: customer_name
            description: "Name of the customer"
            tests:
              - not_null
          - name: email
            description: "Email address of the customer"
          - name: created_date
            description: "Date the customer record was created"

models:
  - name: customer_details_brz
    description: "Bronze layer customer details with data quality validations and audit information"
    columns:
      - name: customer_id
        description: "Unique identifier for the customer"
        tests:
          - not_null
          - unique
      - name: customer_name
        description: "Standardized customer name (trimmed and uppercase)"
        tests:
          - not_null
      - name: email
        description: "Validated and standardized email address (lowercase and trimmed)"
      - name: created_date
        description: "Date the customer record was created in source system"
      - name: created_at
        description: "Timestamp when record was created in bronze layer"
        tests:
          - not_null
      - name: updated_at
        description: "Timestamp when record was last updated in bronze layer"
        tests:
          - not_null
      - name: process_status
        description: "Data quality validation status (VALID/INVALID_ID/INVALID_NAME/INVALID_EMAIL)"
        tests:
          - not_null
          - accepted_values:
              values: ['VALID', 'INVALID_ID', 'INVALID_NAME', 'INVALID_EMAIL']
      - name: dbt_run_timestamp
        description: "DBT run start timestamp for audit purposes"
      - name: dbt_invocation_id
        description: "DBT invocation ID for tracking specific runs"

  - name: audit_log
    description: "Audit log for tracking bronze layer processing status"
    columns:
      - name: table_name
        description: "Name of the table being processed"
        tests:
          - not_null
      - name: process_start_time
        description: "Process start timestamp"
      - name: process_end_time
        description: "Process completion timestamp"
      - name: status
        description: "Processing status (STARTED/COMPLETED/FAILED)"
        tests:
          - not_null
      - name: dbt_run_timestamp
        description: "DBT run start timestamp"
      - name: dbt_invocation_id
        description: "DBT invocation ID for tracking"