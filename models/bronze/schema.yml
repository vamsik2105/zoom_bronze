version: 2

sources:
  - name: raw
    description: "Raw Zoom data tables"
    tables:
      - name: users
        description: "Raw user data from Zoom"
        columns:
          - name: user_id
            description: "Unique identifier for user"
            tests:
              - not_null
              - unique
          - name: user_name
            description: "User display name"
          - name: email
            description: "User email address"
          - name: company
            description: "User company"
          - name: plan_type
            description: "Zoom plan type"
          - name: load_timestamp
            description: "When record was loaded"
          - name: update_timestamp
            description: "When record was last updated"
          - name: source_system
            description: "Source system identifier"

      - name: meetings
        description: "Raw meeting data from Zoom"
        columns:
          - name: meeting_id
            description: "Unique identifier for meeting"
            tests:
              - not_null
              - unique
          - name: host_id
            description: "Meeting host user ID"
          - name: meeting_topic
            description: "Meeting topic/title"
          - name: start_time
            description: "Meeting start time"
          - name: end_time
            description: "Meeting end time"
          - name: duration_minutes
            description: "Meeting duration in minutes"

      - name: participants
        description: "Raw participant data from Zoom"
        columns:
          - name: participant_id
            description: "Unique identifier for participant"
            tests:
              - not_null
              - unique
          - name: meeting_id
            description: "Associated meeting ID"
          - name: user_id
            description: "Participant user ID"
          - name: join_time
            description: "When participant joined"
          - name: leave_time
            description: "When participant left"

      - name: feature_usage
        description: "Raw feature usage data from Zoom"
        columns:
          - name: usage_id
            description: "Unique identifier for usage record"
            tests:
              - not_null
              - unique
          - name: meeting_id
            description: "Associated meeting ID"
          - name: feature_name
            description: "Name of feature used"
          - name: usage_count
            description: "Number of times feature was used"
          - name: usage_date
            description: "Date of feature usage"

      - name: webinars
        description: "Raw webinar data from Zoom"
        columns:
          - name: webinar_id
            description: "Unique identifier for webinar"
            tests:
              - not_null
              - unique
          - name: host_id
            description: "Webinar host user ID"
          - name: webinar_topic
            description: "Webinar topic/title"
          - name: start_time
            description: "Webinar start time"
          - name: end_time
            description: "Webinar end time"
          - name: registrants
            description: "Number of registrants"

      - name: support_tickets
        description: "Raw support ticket data from Zoom"
        columns:
          - name: ticket_id
            description: "Unique identifier for support ticket"
            tests:
              - not_null
              - unique
          - name: user_id
            description: "User who created ticket"
          - name: ticket_type
            description: "Type of support ticket"
          - name: resolution_status
            description: "Current resolution status"
          - name: open_date
            description: "Date ticket was opened"

      - name: licenses
        description: "Raw license data from Zoom"
        columns:
          - name: license_id
            description: "Unique identifier for license"
            tests:
              - not_null
              - unique
          - name: license_type
            description: "Type of license"
          - name: assigned_to_user_id
            description: "User assigned to license"
          - name: start_date
            description: "License start date"
          - name: end_date
            description: "License end date"

      - name: billing_events
        description: "Raw billing event data from Zoom"
        columns:
          - name: event_id
            description: "Unique identifier for billing event"
            tests:
              - not_null
              - unique
          - name: user_id
            description: "User associated with billing event"
          - name: event_type
            description: "Type of billing event"
          - name: amount
            description: "Billing amount"
          - name: event_date
            description: "Date of billing event"

models:
  - name: audit_log
    description: "Audit log for tracking data processing"
    columns:
      - name: source_table
        description: "Name of source table being processed"
        tests:
          - not_null
      - name: operation_type
        description: "Type of operation (LOAD_START, LOAD_COMPLETE, etc.)"
      - name: record_count
        description: "Number of records processed"
      - name: process_status
        description: "Status of processing (RUNNING, SUCCESS, FAILED)"
      - name: created_at
        description: "When audit record was created"
      - name: updated_at
        description: "When audit record was last updated"

  - name: bz_users
    description: "Bronze layer users table"
    columns:
      - name: user_id
        description: "Unique identifier for user"
        tests:
          - not_null
          - unique
      - name: process_status
        description: "Processing status"
        tests:
          - accepted_values:
              values: ['PROCESSED', 'FAILED', 'PENDING']

  - name: bz_meetings
    description: "Bronze layer meetings table"
    columns:
      - name: meeting_id
        description: "Unique identifier for meeting"
        tests:
          - not_null
