version: 2

sources:
  - name: raw
    description: "Raw data layer containing source system data"
    schema: raw
    tables:
      - name: customer
        description: "Raw customer data from source system"
        columns:
          - name: customer_id
            description: "Unique identifier for customer"
          - name: first_name
            description: "Customer first name"
          - name: last_name
            description: "Customer last name"
          - name: email
            description: "Customer email address"
          - name: phone_number
            description: "Customer phone number"
          - name: region_id
            description: "Foreign key to region table"
          - name: created_date
            description: "Date when customer record was created"
            
      - name: orders
        description: "Raw orders data from source system"
        columns:
          - name: order_id
            description: "Unique identifier for order"
          - name: customer_id
            description: "Foreign key to customer table"
          - name: product_name
            description: "Name of the product ordered"
          - name: quantity
            description: "Quantity of product ordered"
          - name: price
            description: "Price per unit of product"
          - name: order_date
            description: "Date when order was placed"
            
      - name: region
        description: "Raw region data from source system"
        columns:
          - name: region_id
            description: "Unique identifier for region"
          - name: region_name
            description: "Name of the region"
          - name: country
            description: "Country name"

models:
  - name: audit_log_bz
    description: "Audit log for tracking data transformations and loads"
    columns:
      - name: audit_id
        description: "Unique audit identifier"
      - name: source_layer
        description: "Source layer name (RAW/BRONZE/SILVER)"
      - name: source_table
        description: "Source table name"
      - name: target_layer
        description: "Target layer name"
      - name: target_table
        description: "Target table name"
      - name: load_type
        description: "Type of load (FULL/INCREMENTAL)"
      - name: load_start_time
        description: "When the load started"
      - name: load_end_time
        description: "When the load completed"
      - name: record_count_loaded
        description: "Number of records loaded"
      - name: status
        description: "Load status"
      - name: error_message
        description: "Error message if load failed"
      - name: run_id
        description: "DBT run ID"
      - name: created_by
        description: "User who triggered the job"
      - name: created_at
        description: "Timestamp of record creation"
              
  - name: bronze_customer
    description: "Bronze layer customer data with basic transformations"
    columns:
      - name: customer_id
        description: "Unique identifier for customer"
      - name: first_name
        description: "Customer first name"
      - name: last_name
        description: "Customer last name"
      - name: full_name
        description: "Customer full name (first + last)"
      - name: email
        description: "Customer email address"
      - name: phone_number
        description: "Customer phone number"
      - name: region_id
        description: "Foreign key to region table"
      - name: created_date
        description: "Date when customer record was created"
      - name: created_at
        description: "Timestamp when record was created in bronze layer"
      - name: updated_at
        description: "Timestamp when record was last updated"
      - name: load_date
        description: "Date when record was loaded into bronze layer"
          
  - name: bronze_orders
    description: "Bronze layer orders data with basic transformations"
    columns:
      - name: order_id
        description: "Unique identifier for order"
      - name: customer_id
        description: "Foreign key to customer table"
      - name: product_name
        description: "Name of the product ordered"
      - name: quantity
        description: "Quantity of product ordered"
      - name: price
        description: "Price per unit of product"
      - name: order_date
        description: "Date when order was placed"
      - name: shipped_date
        description: "Date when order was shipped"
      - name: order_status
        description: "Order status (normalized to uppercase)"
      - name: order_delay_days
        description: "Number of days between order and ship date"
      - name: created_at
        description: "Timestamp when record was created in bronze layer"
      - name: updated_at
        description: "Timestamp when record was last updated"
      - name: load_date
        description: "Date when record was loaded into bronze layer"
          
  - name: bronze_region
    description: "Bronze layer region data with basic transformations"
    columns:
      - name: region_id
        description: "Unique identifier for region"
      - name: region_name
        description: "Region name (title case)"
      - name: country
        description: "Country name (uppercase)"
      - name: created_at
        description: "Timestamp when record was created in bronze layer"
      - name: updated_at
        description: "Timestamp when record was last updated"
      - name: load_date
        description: "Date when record was loaded into bronze layer"
