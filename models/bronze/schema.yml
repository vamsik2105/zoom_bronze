version: 2

sources:
  - name: raw_zoom
    database: RAW
    schema: RAW
    description: "Raw Zoom data tables containing unprocessed customer analytics information"
    tables:
      - name: users
        description: "Raw user data from Zoom platform"
        columns:
          - name: user_id
            description: "Unique identifier for each user"
          - name: user_name
            description: "User name"
          - name: email
            description: "User email address"
          - name: company
            description: "Company name"
          - name: plan_type
            description: "User plan type"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system of the data"

      - name: meetings
        description: "Raw meeting data"
        columns:
          - name: meeting_id
            description: "Unique identifier for each meeting"
          - name: host_id
            description: "User ID of the meeting host"
          - name: meeting_topic
            description: "Meeting topic or title"
          - name: start_time
            description: "Scheduled start time of the meeting"
          - name: end_time
            description: "End time of the meeting"
          - name: duration_minutes
            description: "Meeting duration in minutes"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system of the data"

      - name: participants
        description: "Raw participant data for meetings"
        columns:
          - name: participant_id
            description: "Unique identifier for each participant record"
          - name: meeting_id
            description: "Meeting identifier the participant joined"
          - name: user_id
            description: "User ID of the participant"
          - name: join_time
            description: "Timestamp when participant joined"
          - name: leave_time
            description: "Timestamp when participant left"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system of the data"

      - name: feature_usage
        description: "Raw feature usage data"
        columns:
          - name: usage_id
            description: "Unique identifier for each usage record"
          - name: meeting_id
            description: "Meeting ID where feature was used"
          - name: feature_name
            description: "Name of the feature used"
          - name: usage_count
            description: "Number of times feature was used"
          - name: usage_date
            description: "Date when feature was used"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system of the data"

      - name: webinars
        description: "Raw webinar data"
        columns:
          - name: webinar_id
            description: "Unique identifier for each webinar"
          - name: host_id
            description: "User ID of the webinar host"
          - name: webinar_topic
            description: "Webinar topic or title"
          - name: start_time
            description: "Scheduled start time of the webinar"
          - name: end_time
            description: "End time of the webinar"
          - name: registrants
            description: "Number of registrants"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system of the data"

      - name: support_tickets
        description: "Raw support ticket data"
        columns:
          - name: ticket_id
            description: "Unique identifier for each support ticket"
          - name: user_id
            description: "User ID who created the ticket"
          - name: ticket_type
            description: "Type of support ticket"
          - name: resolution_status
            description: "Current resolution status"
          - name: open_date
            description: "Date when ticket was opened"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system of the data"

      - name: licenses
        description: "Raw license data"
        columns:
          - name: license_id
            description: "Unique identifier for each license"
          - name: license_type
            description: "Type of license"
          - name: assigned_to_user_id
            description: "User ID assigned to the license"
          - name: start_date
            description: "License start date"
          - name: end_date
            description: "License end date"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system of the data"

      - name: billing_events
        description: "Raw billing event data"
        columns:
          - name: event_id
            description: "Unique identifier for each billing event"
          - name: user_id
            description: "User ID associated with the billing event"
          - name: event_type
            description: "Type of billing event"
          - name: amount
            description: "Monetary amount of the billing event"
          - name: event_date
            description: "Date when billing event occurred"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system of the data"

models:
  - name: bz_audit_log
    description: "Bronze layer audit log table for tracking processing of all bronze models"
    columns:
      - name: record_id
        description: "Auto-incrementing primary key for each audit record"
        tests:
          - not_null
          - unique
      - name: source_table
        description: "Name of the source table being processed (max 255 characters)"
        tests:
          - not_null
      - name: load_timestamp
        description: "Timestamp when the processing occurred"
        tests:
          - not_null
      - name: processed_by
        description: "User or system that processed the data"
        tests:
          - not_null
      - name: processing_time
        description: "Time taken for processing in seconds (with 3 decimal precision)"
        tests:
          - not_null
      - name: status
        description: "Processing status"
        tests:
          - not_null
          - accepted_values:
              values: ['SUCCESS', 'FAILED', 'IN_PROGRESS', 'CANCELLED']

  - name: bz_users
    description: "Bronze layer users table with basic data quality checks"
    columns:
      - name: user_id
        description: "Unique identifier for each user"
        tests:
          - not_null
          - unique
      - name: user_name
        description: "User name"
      - name: email
        description: "User email address"
      - name: company
        description: "Company name"
      - name: plan_type
        description: "User plan type"
      - name: load_timestamp
        description: "Timestamp when record was loaded"
        tests:
          - not_null
      - name: update_timestamp
        description: "Timestamp when record was last updated"
        tests:
          - not_null
      - name: source_system
        description: "Source system of the data"
        tests:
          - not_null
