        description: "Unique identifier for participant"
        tests:
          - not_null
          - unique
      - name: meeting_id
        description: "Meeting ID the participant attended"
      - name: user_id
        description: "User ID of the participant"
      - name: join_time
        description: "Time when participant joined the meeting"
      - name: leave_time
