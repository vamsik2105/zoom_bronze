version: 2

models:
  - name: audit_log_bz
    description: "Audit log table for tracking all bronze layer transformations"
    columns:
      - name: audit_id
        description: "Unique audit identifier"
      - name: source_layer
        description: "Source layer name"
      - name: source_table
        description: "Source table name"
      - name: target_layer
        description: "Target layer name"
      - name: target_table
        description: "Target table name"
      - name: status
        description: "Load status"

  - name: region_bz
    description: "Bronze layer region data"
    columns:
      - name: region_id
        description: "Unique identifier for region"
      - name: region_name
        description: "Properly formatted region name"
      - name: country
        description: "Uppercase country name"
      - name: load_date
        description: "Date when record was loaded"

  - name: customer_bz
    description: "Bronze layer customer data"
    columns:
      - name: customer_id
        description: "Unique identifier for customer"
      - name: full_name
        description: "Concatenated first and last name"
      - name: email
        description: "Formatted email address"
      - name: region_id
        description: "Foreign key to region table"
      - name: load_date
        description: "Date when record was loaded"

  - name: orders_bz
    description: "Bronze layer orders data"
    columns:
      - name: order_id
        description: "Unique identifier for order"
      - name: customer_id
        description: "Foreign key to customer table"
      - name: order_date
        description: "Date when order was placed"
      - name: order_amount
        description: "Total order amount"
      - name: order_status
        description: "Order status"
      - name: load_date
        description: "Date when record was loaded"
