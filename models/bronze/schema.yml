version: 2

sources:
  - name: raw_schema
    description: "Raw data source schema containing unprocessed data"
    tables:
      - name: region
        description: "Raw region data from source systems"
        columns:
          - name: region_id
            description: "Unique identifier for region"
            tests:
              - not_null
              - unique
          - name: region_name
            description: "Name of the region"
          - name: country
            description: "Country name"
          - name: created_date
            description: "Date when record was created"
            
      - name: customer
        description: "Raw customer data from source systems"
        columns:
          - name: customer_id
            description: "Unique identifier for customer"
            tests:
              - not_null
              - unique
          - name: first_name
            description: "Customer first name"
          - name: last_name
            description: "Customer last name"
          - name: email
            description: "Customer email address"
          - name: phone_number
            description: "Customer phone number"
          - name: region_id
            description: "Foreign key to region table"
          - name: created_date
            description: "Date when record was created"
            
      - name: orders
        description: "Raw orders data from source systems"
        columns:
          - name: order_id
            description: "Unique identifier for order"
            tests:
              - not_null
              - unique
          - name: customer_id
            description: "Foreign key to customer table"
          - name: product_name
            description: "Name of the product ordered"
          - name: quantity
            description: "Quantity of products ordered"
          - name: price
            description: "Price per unit"
          - name: order_date
            description: "Date when order was placed"

models:
  - name: audit_log_bz
    description: "Audit log table for tracking bronze layer transformations"
    columns:
      - name: audit_id
        description: "Unique audit identifier"
        tests:
          - not_null
      - name: source_layer
        description: "Source layer name (RAW/BRONZE/SILVER)"
      - name: source_table
        description: "Source table name"
      - name: target_layer
        description: "Target layer name"
      - name: target_table
        description: "Target table name"
      - name: load_type
        description: "Type of load (FULL/INCREMENTAL)"
      - name: load_start_time
        description: "Data load start time"
      - name: load_end_time
        description: "Data load end time"
      - name: record_count_loaded
        description: "Number of records loaded"
      - name: status
        description: "Load status (SUCCESS/FAILED)"
      - name: error_message
        description: "Error message if load fails"
      - name: run_id
        description: "DBT run ID for traceability"
      - name: created_by
        description: "User who triggered the job"
      - name: created_at
        description: "Timestamp of record creation"
        
  - name: region_bz
    description: "Bronze layer region data with cleaned and standardized values"
    columns:
      - name: region_id
        description: "Unique identifier for region"
        tests:
          - not_null
          - unique
      - name: region_name
        description: "Standardized region name in proper case"
      - name: country
        description: "Standardized country name in uppercase"
      - name: created_at
        description: "Original creation timestamp"
      - name: last_updated
        description: "Last update timestamp"
      - name: load_date
        description: "Date when record was loaded into bronze layer"
        
  - name: customer_bz
    description: "Bronze layer customer data with cleaned and transformed values"
    columns:
      - name: customer_id
        description: "Unique identifier for customer"
        tests:
          - not_null
          - unique
      - name: full_name
        description: "Concatenated first and last name"
      - name: email
        description: "Standardized email address in lowercase"
      - name: phone_number
        description: "Cleaned phone number"
      - name: region_id
        description: "Foreign key to region table"
      - name: created_at
        description: "Original creation timestamp"
      - name: last_updated
        description: "Last update timestamp"
      - name: load_date
        description: "Date when record was loaded into bronze layer"
        
  - name: orders_bz
    description: "Bronze layer orders data with business logic applied"
    columns:
      - name: order_id
        description: "Unique identifier for order"
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Foreign key to customer table"
      - name: order_date
        description: "Date when order was placed"
      - name: shipped_date
        description: "Date when order was shipped"
      - name: order_amount
        description: "Total order amount"
      - name: order_status
        description: "Standardized order status in uppercase"
      - name: order_delay_days
        description: "Number of days between order and ship date"
      - name: created_at
        description: "Original creation timestamp"
      - name: last_updated
        description: "Last update timestamp"
      - name: load_date
        description: "Date when record was loaded into bronze layer"
