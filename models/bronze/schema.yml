version: 2

models:
  - name: bz_audit_log
    description: "Audit log for bronze layer processing"
    columns:
      - name: record_id
        description: "Auto-incrementing record ID"
      - name: source_table
        description: "Name of the source table being processed"
        tests:
          - not_null
      - name: load_timestamp
        description: "Timestamp when the process started"
        tests:
          - not_null
      - name: processed_by
        description: "User or process that performed the transformation"
      - name: processing_time
        description: "Time taken to process in seconds"
      - name: status
        description: "Status of the processing (STARTED, COMPLETED, FAILED)"
        tests:
          - accepted_values:
              values: ['STARTED', 'COMPLETED', 'FAILED']
              
  - name: bz_users
    description: "Bronze layer users table with 1-to-1 mapping from raw"
    columns:
      - name: user_id
        description: "Unique identifier for user"
        tests:
          - not_null
          - unique
      - name: user_name
        description: "User's full name"
      - name: email
        description: "User's email address"
      - name: company
        description: "User's company"
      - name: plan_type
        description: "User's subscription plan type"
      - name: load_timestamp
        description: "Original load timestamp from raw"
      - name: update_timestamp
        description: "Original update timestamp from raw"
      - name: source_system
        description: "Source system identifier"
      - name: bronze_created_at
        description: "Timestamp when record was created in bronze"
        tests:
          - not_null
      - name: bronze_created_by
        description: "Process that created the record"
        tests:
          - not_null
          
  - name: bz_meetings
    description: "Bronze layer meetings table with 1-to-1 mapping from raw"
    columns:
      - name: meeting_id
        description: "Unique identifier for meeting"
        tests:
          - not_null
          - unique
      - name: host_id
        description: "User ID of meeting host"
      - name: meeting_topic
        description: "Topic or title of the meeting"
      - name: start_time
        description: "Meeting start time"
      - name: end_time
        description: "Meeting end time"
      - name: duration_minutes
        description: "Duration of meeting in minutes"
      - name: load_timestamp
        description: "Original load timestamp from raw"
      - name: update_timestamp
        description: "Original update timestamp from raw"
      - name: source_system
        description: "Source system identifier"
      - name: bronze_created_at
        description: "Timestamp when record was created in bronze"
        tests:
          - not_null
      - name: bronze_created_by
        description: "Process that created the record"
        tests:
          - not_null
          
  - name: bz_participants
