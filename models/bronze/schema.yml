        tests:
          - not_null
          - unique
      - name: process_status
        description: "Processing status"
        tests:
          - accepted_values:
              values: ['PROCESSED', 'FAILED', 'PENDING']

  - name: bz_licenses
    description: "Bronze layer licenses table"
    columns:
      - name: license_id
        description: "Unique identifier for license"
        tests:
          - not_null
          - unique
      - name: process_status
        description: "Processing status"
        tests:
          - accepted_values:
              values: ['PROCESSED', 'FAILED', 'PENDING']

  - name: bz_billing_events
