version: 2

sources:
  - name: raw_data
    description: "Raw data layer containing unprocessed data from various sources"
    tables:
      - name: region
        description: "Raw region data"
        columns:
          - name: region_id
            description: "Unique identifier for region"
            tests:
              - unique
              - not_null
          - name: region_name
            description: "Name of the region"
            tests:
              - not_null
          - name: country
            description: "Country name"
            tests:
              - not_null
      
      - name: customer
        description: "Raw customer data"
        columns:
          - name: customer_id
            description: "Unique identifier for customer"
            tests:
              - unique
              - not_null
          - name: first_name
            description: "Customer first name"
            tests:
              - not_null
          - name: last_name
            description: "Customer last name"
            tests:
              - not_null
          - name: email
            description: "Customer email address"
            tests:
              - not_null
          - name: region_id
            description: "Foreign key to region table"
      
      - name: orders
        description: "Raw orders data"
        columns:
          - name: order_id
            description: "Unique identifier for order"
            tests:
              - unique
              - not_null
          - name: customer_id
            description: "Foreign key to customer table"
            tests:
              - not_null
          - name: order_date
            description: "Date when order was placed"
            tests:
              - not_null
          - name: price
            description: "Order price"
            tests:
              - not_null

models:
  - name: audit_log_bz
    description: "Audit log table for tracking all bronze layer transformations"
    columns:
      - name: audit_id
        description: "Unique audit identifier"
        tests:
          - unique
      - name: source_layer
        description: "Source layer name (RAW/BRONZE/SILVER)"
        tests:
          - not_null
      - name: source_table
        description: "Source table name"
        tests:
          - not_null
      - name: target_layer
        description: "Target layer name"
        tests:
          - not_null
      - name: target_table
        description: "Target table name"
        tests:
          - not_null
      - name: status
        description: "Load status (SUCCESS/FAILED)"
        tests:
          - accepted_values:
              values: ['SUCCESS', 'FAILED', 'STARTED']

  - name: region_bz
    description: "Bronze layer region data with cleaned and validated information"
    columns:
      - name: region_id
        description: "Unique identifier for region"
        tests:
          - unique
          - not_null
      - name: region_name
        description: "Properly formatted region name"
        tests:
          - not_null
      - name: country
        description: "Uppercase country name"
        tests:
          - not_null
      - name: load_date
        description: "Date when record was loaded into bronze layer"
        tests:
          - not_null

  - name: customer_bz
    description: "Bronze layer customer data with cleaned and validated information"
    columns:
      - name: customer_id
        description: "Unique identifier for customer"
        tests:
          - unique
          - not_null
      - name: full_name
        description: "Concatenated first and last name"
        tests:
          - not_null
      - name: email
        description: "Validated and formatted email address"
        tests:
          - not_null
      - name: region_id
        description: "Foreign key to region table"
        tests:
          - relationships:
              to: ref('region_bz')
              field: region_id
      - name: load_date
        description: "Date when record was loaded into bronze layer"
        tests:
          - not_null

  - name: orders_bz
    description: "Bronze layer orders data with cleaned and validated information"
    columns:
      - name: order_id
        description: "Unique identifier for order"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to customer table"
        tests:
          - not_null
          - relationships:
              to: ref('customer_bz')
              field: customer_id
      - name: order_date
        description: "Date when order was placed"
        tests:
          - not_null
      - name: order_status
        description: "Uppercase order status"
        tests:
          - not_null
      - name: order_delay_days
        description: "Number of days between order and shipping"
      - name: load_date
        description: "Date when record was loaded into bronze layer"
        tests:
          - not_null
