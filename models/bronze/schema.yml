version: 2

sources:
  - name: raw
    database: RAW
    tables:
      - name: users
      - name: meetings
      - name: participants
      - name: feature_usage
      - name: webinars
      - name: support_tickets
      - name: licenses
      - name: billing_events

models:
  - name: audit_log
    description: Audit log for tracking model execution
    columns:
      - name: audit_id
        description: Unique identifier for the audit record
      - name: model_name
        description: Name of the model being audited
      - name: process_timestamp
        description: Timestamp of the process
      - name: process_status
        description: Status of the process (START/COMPLETE/ERROR)
      - name: error_message
        description: Error message if process failed
      - name: record_count
        description: Count of records processed

  - name: bz_users
    description: Bronze layer for users data
    columns:
      - name: user_id
        description: Unique identifier for the user
      - name: user_name
        description: Name of the user
      - name: email
        description: Email address of the user
      - name: company
        description: Company the user belongs to
      - name: plan_type
        description: Type of Zoom plan the user has
      - name: load_timestamp
        description: Timestamp when the record was loaded
      - name: update_timestamp
        description: Timestamp when the record was last updated
      - name: source_system
        description: Source system of the data
