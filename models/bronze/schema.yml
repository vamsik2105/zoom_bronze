version: 2

models:
  - name: audit_log
    description: "Audit log table for tracking model processing"
    columns:
      - name: log_id
        description: "Unique identifier for the log entry"
        tests:
          - unique
          - not_null
      - name: model_name
        description: "Name of the model being processed"
      - name: process_timestamp
        description: "Timestamp when the process was logged"
      - name: status
        description: "Status of the process (STARTED, COMPLETED, ERROR)"
      - name: message
        description: "Additional information about the process"
      - name: row_count
        description: "Number of rows processed (for COMPLETED status)"

  - name: bz_users
    description: "Bronze layer table for user data"
    columns:
      - name: user_id
        description: "Unique identifier for the user"
        tests:
          - unique
          - not_null
      - name: user_name
        description: "Name of the user"
      - name: email
        description: "Email address of the user"
      - name: company
        description: "Company the user belongs to"
      - name: plan_type
        description: "Type of plan the user has"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: update_timestamp
        description: "Timestamp when the data was last updated"
      - name: source_system
        description: "Source system the data came from"

  - name: bz_meetings
    description: "Bronze layer table for meeting data"
    columns:
      - name: meeting_id
        description: "Unique identifier for the meeting"
        tests:
          - unique
          - not_null
      - name: host_id
        description: "ID of the user hosting the meeting"
      - name: meeting_topic
        description: "Topic of the meeting"
      - name: start_time
        description: "Start time of the meeting"
      - name: end_time
        description: "End time of the meeting"
      - name: duration_minutes
        description: "Duration of the meeting in minutes"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: update_timestamp
        description: "Timestamp when the data was last updated"
      - name: source_system
        description: "Source system the data came from"

  - name: bz_participants
    description: "Bronze layer table for participant data"
    columns:
      - name: participant_id
        description: "Unique identifier for the participant"
        tests:
          - unique
          - not_null
      - name: meeting_id
        description: "ID of the meeting the participant attended"
      - name: user_id
        description: "ID of the user who participated"
      - name: join_time
        description: "Time when the participant joined the meeting"
      - name: leave_time
        description: "Time when the participant left the meeting"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: update_timestamp
        description: "Timestamp when the data was last updated"
      - name: source_system
        description: "Source system the data came from"

  - name: bz_feature_usage
    description: "Bronze layer table for feature usage data"
    columns:
      - name: usage_id
        description: "Unique identifier for the feature usage"
        tests:
          - unique
          - not_null
      - name: meeting_id
        description: "ID of the meeting where the feature was used"
      - name: feature_name
        description: "Name of the feature that was used"
      - name: usage_count
        description: "Number of times the feature was used"
      - name: usage_date
        description: "Date when the feature was used"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: update_timestamp
        description: "Timestamp when the data was last updated"
      - name: source_system
        description: "Source system the data came from"

  - name: bz_webinars
    description: "Bronze layer table for webinar data"
    columns:
      - name: webinar_id
        description: "Unique identifier for the webinar"
        tests:
          - unique
          - not_null
      - name: host_id
        description: "ID of the user hosting the webinar"
      - name: webinar_topic
        description: "Topic of the webinar"
      - name: start_time
        description: "Start time of the webinar"
      - name: end_time
        description: "End time of the webinar"
      - name: registrants
        description: "Number of registrants for the webinar"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: update_timestamp
        description: "Timestamp when the data was last updated"
      - name: source_system
        description: "Source system the data came from"

  - name: bz_support_tickets
    description: "Bronze layer table for support ticket data"
    columns:
      - name: ticket_id
        description: "Unique identifier for the support ticket"
        tests:
          - unique
          - not_null
      - name: user_id
        description: "ID of the user who submitted the ticket"
      - name: ticket_type
        description: "Type of support ticket"
      - name: resolution_status
        description: "Current status of the ticket resolution"
      - name: open_date
        description: "Date when the ticket was opened"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: update_timestamp
        description: "Timestamp when the data was last updated"
      - name: source_system
        description: "Source system the data came from"

  - name: bz_licenses
    description: "Bronze layer table for license data"
    columns:
      - name: license_id
        description: "Unique identifier for the license"
        tests:
          - unique
          - not_null
      - name: license_type
        description: "Type of license"
      - name: assigned_to_user_id
        description: "ID of the user the license is assigned to"
      - name: start_date
        description: "Start date of the license"
      - name: end_date
        description: "End date of the license"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: update_timestamp
        description: "Timestamp when the data was last updated"
      - name: source_system
        description: "Source system the data came from"

  - name: bz_billing_events
    description: "Bronze layer table for billing event data"
    columns:
      - name: event_id
        description: "Unique identifier for the billing event"
        tests:
          - unique
          - not_null
      - name: user_id
        description: "ID of the user associated with the billing event"
      - name: event_type
        description: "Type of billing event"
      - name: amount
        description: "Amount associated with the billing event"
      - name: event_date
        description: "Date when the billing event occurred"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: update_timestamp
        description: "Timestamp when the data was last updated"
      - name: source_system
        description: "Source system the data came from"
