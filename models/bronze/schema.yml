version: 2

sources:
  - name: raw
    tables:
      - name: CUSTOMER_DETAILS
        description: "Raw customer details data"
        columns:
          - name: CUSTOMER_ID
            description: "Unique identifier for the customer"
          - name: CUSTOMER_NAME
            description: "Name of the customer"
          - name: EMAIL
            description: "Email address of the customer"

models:
  - name: bz_audit_log
    description: "Audit log table to track all data transformations"
    columns:
      - name: log_id
        description: "Unique identifier for the audit log entry"
        tests:
          - unique
          - not_null
        type: varchar(255)
      - name: created_at
        description: "Timestamp when the audit log entry was created"
        type: timestamp
      - name: updated_at
        description: "Timestamp when the audit log entry was last updated"
        type: timestamp
      - name: process_status
        description: "Status of the process (PENDING, RUNNING, COMPLETED, FAILED)"
        type: varchar(50)
      - name: created_by
        description: "User or system that created the audit log entry"
        type: varchar(100)
      - name: updated_by
        description: "User or system that last updated the audit log entry"
        type: varchar(100)
      - name: source_table
        description: "Source table for the transformation"
        type: varchar(255)
      - name: target_table
        description: "Target table for the transformation"
        type: varchar(255)
      - name: process_name
        description: "Name of the process or transformation"
        type: varchar(255)
      - name: start_time
        description: "Start time of the process"
        type: timestamp
      - name: end_time
        description: "End time of the process"
        type: timestamp
      - name: row_count
        description: "Number of rows processed"
        type: integer
      - name: error_message
        description: "Error message if the process failed"
        type: varchar(4000)

  - name: bz_customer_details
    description: "Bronze layer for customer details"
    columns:
      - name: CUSTOMER_ID
        description: "Unique identifier for the customer"
        tests:
          - unique
          - not_null
      - name: CUSTOMER_NAME
        description: "Name of the customer"
        tests:
          - not_null
      - name: EMAIL
        description: "Email address of the customer"
      - name: created_at
        description: "Timestamp when the record was created"
        type: timestamp
      - name: updated_at
        description: "Timestamp when the record was last updated"
        type: timestamp
      - name: process_status
        description: "Status of the data processing"
        type: varchar(50)
