      - name: process_status
        description: "Processing status"
        tests:
          - accepted_values:
              values: ['PROCESSED', 'FAILED', 'PENDING']

  - name: bz_support_tickets
    description: "Bronze layer support tickets table"
    columns:
      - name: ticket_id
