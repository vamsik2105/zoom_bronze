version: 2

sources:
  - name: raw
    description: Raw data from Zoom platform
    schema: RAW
    tables:
      - name: users
        description: Raw user data
      - name: meetings
        description: Raw meeting data
      - name: participants
        description: Raw participant data
      - name: feature_usage
        description: Raw feature usage data
      - name: webinars
        description: Raw webinar data
      - name: support_tickets
        description: Raw support ticket data
      - name: licenses
        description: Raw license data
      - name: billing_events
        description: Raw billing event data

models:
  - name: bz_audit_log
    description: "Audit log for bronze layer processing"
    columns:
      - name: record_id
        description: "Auto-incrementing record identifier"
        tests:
          - not_null
          - unique
      - name: source_table
        description: "Name of the source table being processed"
        tests:
          - not_null
      - name: load_timestamp
        description: "Timestamp when processing started"
        tests:
          - not_null
      - name: processed_by
        description: "System or user that processed the data"
        tests:
          - not_null
      - name: processing_time
        description: "Time taken to process in seconds"
        tests:
          - not_null
      - name: status
        description: "Processing status"
        tests:
          - not_null
          - accepted_values:
              values: ['STARTED', 'COMPLETED', 'FAILED', 'INITIALIZED']
