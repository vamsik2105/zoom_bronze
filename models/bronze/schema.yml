version: 2

sources:
  - name: raw
    description: "Raw data layer containing unprocessed data from Zoom platform"
    tables:
      - name: users
        description: "Raw user data from Zoom platform"
      - name: meetings
        description: "Raw meeting data from Zoom platform"
      - name: participants
        description: "Raw participant data from Zoom platform"
      - name: feature_usage
        description: "Raw feature usage data from Zoom platform"
      - name: webinars
        description: "Raw webinar data from Zoom platform"
      - name: support_tickets
        description: "Raw support ticket data from Zoom platform"
      - name: licenses
        description: "Raw license data from Zoom platform"
      - name: billing_events
        description: "Raw billing event data from Zoom platform"

models:
  - name: audit_log_1
    description: "Audit log table for tracking bronze layer transformations"
    columns:
      - name: table_name
        description: "Name of the table being processed"
        tests:
          - not_null
      - name: process_start_time
        description: "Timestamp when the process started"
      - name: process_end_time
        description: "Timestamp when the process ended"
      - name: process_status
        description: "Status of the process (STARTED, COMPLETED, FAILED)"
      - name: process_message
        description: "Message describing the process"
      - name: created_at
        description: "Record creation timestamp"
      - name: updated_at
        description: "Record update timestamp"

  - name: bz_users_1
    description: "Bronze layer users table with cleaned and validated data"
    columns:
      - name: user_id
        description: "Unique identifier for user"
        tests:
          - not_null
          - unique
      - name: user_name
        description: "Name of the user"
      - name: email
        description: "Email address of the user"
      - name: company
        description: "Company name of the user"
      - name: plan_type
        description: "Subscription plan type"
      - name: load_timestamp
        description: "Original load timestamp from source"
      - name: update_timestamp
        description: "Timestamp when record was processed in bronze layer"
      - name: source_system
        description: "Source system identifier"

  - name: bz_meetings_1
    description: "Bronze layer meetings table with cleaned and validated data"
    columns:
      - name: meeting_id
        description: "Unique identifier for meeting"
        tests:
          - not_null
          - unique
      - name: host_id
        description: "Identifier of the meeting host"
      - name: meeting_topic
        description: "Topic or title of the meeting"
      - name: start_time
        description: "Meeting start timestamp"
      - name: end_time
        description: "Meeting end timestamp"
      - name: duration_minutes
        description: "Meeting duration in minutes"
      - name: load_timestamp
        description: "Original load timestamp from source"
      - name: update_timestamp
        description: "Timestamp when record was processed in bronze layer"
      - name: source_system
        description: "Source system identifier"

  - name: bz_participants_1
    description: "Bronze layer participants table with cleaned and validated data"
    columns:
      - name: participant_id
        description: "Unique identifier for participant"
        tests:
          - not_null
      - name: meeting_id
        description: "Identifier of the meeting"
      - name: user_id
        description: "Identifier of the user"
      - name: join_time
        description: "Timestamp when participant joined"
      - name: leave_time
        description: "Timestamp when participant left"
      - name: load_timestamp
        description: "Original load timestamp from source"
      - name: update_timestamp
        description: "Timestamp when record was processed in bronze layer"
      - name: source_system
        description: "Source system identifier"

  - name: bz_feature_usage_1
    description: "Bronze layer feature usage table with cleaned and validated data"
    columns:
      - name: usage_id
        description: "Unique identifier for usage record"
        tests:
          - not_null
      - name: meeting_id
        description: "Identifier of the meeting"
      - name: feature_name
        description: "Name of the feature used"
      - name: usage_count
        description: "Number of times feature was used"
      - name: usage_date
        description: "Date when feature was used"
      - name: load_timestamp
        description: "Original load timestamp from source"
      - name: update_timestamp
        description: "Timestamp when record was processed in bronze layer"
      - name: source_system
        description: "Source system identifier"

  - name: bz_webinars_1
    description: "Bronze layer webinars table with cleaned and validated data"
    columns:
      - name: webinar_id
        description: "Unique identifier for webinar"
        tests:
          - not_null
          - unique
      - name: host_id
        description: "Identifier of the webinar host"
      - name: webinar_topic
        description: "Topic or title of the webinar"
      - name: start_time
        description: "Webinar start timestamp"
      - name: end_time
        description: "Webinar end timestamp"
      - name: registrants
        description: "Number of registrants"
      - name: load_timestamp
        description: "Original load timestamp from source"
      - name: update_timestamp
        description: "Timestamp when record was processed in bronze layer"
      - name: source_system
        description: "Source system identifier"

  - name: bz_support_tickets_1
    description: "Bronze layer support tickets table with cleaned and validated data"
    columns:
      - name: ticket_id
        description: "Unique identifier for support ticket"
        tests:
          - not_null
          - unique
      - name: user_id
        description: "Identifier of the user who created the ticket"
      - name: ticket_type
        description: "Type or category of the support ticket"
      - name: resolution_status
        description: "Current resolution status of the ticket"
      - name: open_date
        description: "Date when ticket was opened"
      - name: load_timestamp
        description: "Original load timestamp from source"
      - name: update_timestamp
        description: "Timestamp when record was processed in bronze layer"
      - name: source_system
        description: "Source system identifier"

  - name: bz_licenses_1
    description: "Bronze layer licenses table with cleaned and validated data"
    columns:
      - name: license_id
        description: "Unique identifier for license"
        tests:
          - not_null
          - unique
      - name: license_type
        description: "Type of license"
      - name: assigned_to_user_id
        description: "Identifier of the user assigned to the license"
      - name: start_date
        description: "License start date"
      - name: end_date
        description: "License end date"
      - name: load_timestamp
        description: "Original load timestamp from source"
      - name: update_timestamp
        description: "Timestamp when record was processed in bronze layer"
      - name: source_system
        description: "Source system identifier"

  - name: bz_billing_events_1
    description: "Bronze layer billing events table with cleaned and validated data"
    columns:
      - name: event_id
        description: "Unique identifier for billing event"
        tests:
          - not_null
          - unique
      - name: user_id
        description: "Identifier of the user associated with the billing event"
      - name: event_type
        description: "Type of billing event"
      - name: amount
        description: "Amount associated with the billing event"
      - name: event_date
        description: "Date when billing event occurred"
      - name: load_timestamp
        description: "Original load timestamp from source"
      - name: update_timestamp
        description: "Timestamp when record was processed in bronze layer"
      - name: source_system
        description: "Source system identifier"
