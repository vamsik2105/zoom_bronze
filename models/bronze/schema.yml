version: 2

models:
  - name: bz_audit_log
    description: "Audit log for tracking data processing"
    columns:
      - name: record_id
        description: "Unique identifier for the audit record"
      - name: source_table
        description: "Name of the source table being processed"
      - name: load_timestamp
        description: "Timestamp when the processing occurred"
      - name: processed_by
        description: "User who executed the process"
      - name: processing_time
        description: "Time taken to process the data in milliseconds"
      - name: status
        description: "Status of the processing (STARTED, COMPLETED, ERROR)"

  - name: bz_users
    description: "Bronze layer for users data"
    columns:
      - name: user_id
        description: "Unique identifier for the user"
      - name: user_name
        description: "Name of the user"
      - name: email
        description: "Email address of the user"
      - name: company
        description: "Company the user belongs to"
      - name: plan_type
        description: "Type of plan the user is subscribed to"
      - name: load_timestamp
        description: "Timestamp when the record was loaded"
      - name: update_timestamp
        description: "Timestamp when the record was last updated"
      - name: source_system
        description: "Source system from which the data was extracted"
