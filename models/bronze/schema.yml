version: 2

models:
  - name: bz_audit_log
    description: "Audit log for bronze layer processing"
    columns:
      - name: record_id
        description: "Auto-incrementing record ID"
      - name: source_table
        description: "Name of the source table being processed"
      - name: load_timestamp
        description: "Timestamp when the process started"
      - name: processed_by
        description: "User or process that performed the transformation"
      - name: processing_time
        description: "Time taken to process in seconds"
      - name: status
        description: "Status of the processing (STARTED, COMPLETED, FAILED)"
