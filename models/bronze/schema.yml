version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: users
      - name: meetings
      - name: participants
      - name: feature_usage
      - name: webinars
      - name: support_tickets
      - name: licenses
      - name: billing_events

models:
  - name: bz_users
    description: "Bronze layer for user data"
    columns:
      - name: user_id
        description: "Unique identifier for the user"
      - name: user_name
        description: "User's name"
      - name: email
        description: "User's email address"
      - name: company
        description: "User's company"
      - name: plan_type
        description: "User's plan type"
      - name: load_timestamp
        description: "Timestamp when the record was loaded"
      - name: update_timestamp
        description: "Timestamp when the record was last updated"
      - name: source_system
        description: "Source system of the data"

  - name: bz_meetings
    description: "Bronze layer for meeting data"
    columns:
      - name: meeting_id
        description: "Unique identifier for the meeting"
      - name: host_id
        description: "ID of the meeting host"
      - name: meeting_topic
        description: "Topic of the meeting"
      - name: start_time
        description: "Start time of the meeting"
      - name: end_time
        description: "End time of the meeting"
      - name: duration_minutes
        description: "Duration of the meeting in minutes"
      - name: load_timestamp
        description: "Timestamp when the record was loaded"
      - name: update_timestamp
        description: "Timestamp when the record was last updated"
      - name: source_system
        description: "Source system of the data"

  - name: bz_participants
    description: "Bronze layer for participant data"
    columns:
      - name: participant_id
        description: "Unique identifier for the participant"
      - name: meeting_id
        description: "ID of the meeting"
      - name: user_id
        description: "ID of the user"
      - name: join_time
        description: "Time when the participant joined"
      - name: leave_time
        description: "Time when the participant left"
      - name: load_timestamp
        description: "Timestamp when the record was loaded"
      - name: update_timestamp
        description: "Timestamp when the record was last updated"
      - name: source_system
        description: "Source system of the data"

  - name: bz_feature_usage
    description: "Bronze layer for feature usage data"
    columns:
      - name: usage_id
        description: "Unique identifier for the usage record"
      - name: meeting_id
        description: "ID of the meeting"
      - name: feature_name
        description: "Name of the feature"
      - name: usage_count
        description: "Count of feature usage"
      - name: usage_date
        description: "Date of feature usage"
      - name: load_timestamp
        description: "Timestamp when the record was loaded"
      - name: update_timestamp
        description: "Timestamp when the record was last updated"
      - name: source_system
        description: "Source system of the data"

  - name: bz_webinars
    description: "Bronze layer for webinar data"
    columns:
      - name: webinar_id
        description: "Unique identifier for the webinar"
      - name: host_id
        description: "ID of the webinar host"
      - name: webinar_topic
        description: "Topic of the webinar"
      - name: start_time
        description: "Start time of the webinar"
      - name: end_time
        description: "End time of the webinar"
      - name: registrants
        description: "Number of registrants"
      - name: load_timestamp
        description: "Timestamp when the record was loaded"
      - name: update_timestamp
        description: "Timestamp when the record was last updated"
      - name: source_system
        description: "Source system of the data"

  - name: bz_support_tickets
    description: "Bronze layer for support ticket data"
    columns:
      - name: ticket_id
        description: "Unique identifier for the ticket"
      - name: user_id
        description: "ID of the user"
      - name: ticket_type
        description: "Type of the ticket"
      - name: resolution_status
        description: "Status of ticket resolution"
      - name: open_date
        description: "Date when the ticket was opened"
      - name: load_timestamp
        description: "Timestamp when the record was loaded"
      - name: update_timestamp
        description: "Timestamp when the record was last updated"
      - name: source_system
        description: "Source system of the data"

  - name: bz_licenses
    description: "Bronze layer for license data"
    columns:
      - name: license_id
        description: "Unique identifier for the license"
      - name: license_type
        description: "Type of the license"
      - name: assigned_to_user_id
        description: "ID of the user assigned to the license"
      - name: start_date
        description: "Start date of the license"
      - name: end_date
        description: "End date of the license"
      - name: load_timestamp
        description: "Timestamp when the record was loaded"
      - name: update_timestamp
        description: "Timestamp when the record was last updated"
      - name: source_system
        description: "Source system of the data"

  - name: bz_billing_events
    description: "Bronze layer for billing event data"
    columns:
      - name: event_id
        description: "Unique identifier for the event"
      - name: user_id
        description: "ID of the user"
      - name: event_type
        description: "Type of the event"
      - name: amount
        description: "Amount of the billing event"
      - name: event_date
        description: "Date of the event"
      - name: load_timestamp
        description: "Timestamp when the record was loaded"
      - name: update_timestamp
        description: "Timestamp when the record was last updated"
      - name: source_system
        description: "Source system of the data"
