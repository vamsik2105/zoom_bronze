version: 2

models:
  - name: audit_log
    description: "Audit log for tracking data processing"
    columns:
      - name: audit_id
        description: "Unique identifier for the audit record"
      - name: model_name
        description: "Name of the model being processed"
      - name: process_timestamp
        description: "Timestamp of the process"
      - name: process_status
        description: "Status of the process (started, completed, failed)"
      - name: record_count
        description: "Number of records processed"
      - name: error_message
        description: "Error message if any"

  - name: bz_users_1
    description: "Bronze layer for users data"
    columns:
      - name: user_id
        description: "Unique identifier for the user"
      - name: user_name
        description: "Name of the user"
      - name: email
        description: "Email address of the user"
      - name: company
        description: "Company the user belongs to"
      - name: plan_type
        description: "Type of plan the user has"
      - name: load_timestamp
        description: "Timestamp when the record was loaded"
      - name: update_timestamp
        description: "Timestamp when the record was last updated"
      - name: source_system
        description: "Source system of the data"

  - name: bz_meetings_1
    description: "Bronze layer for meetings data"
    columns:
      - name: meeting_id
        description: "Unique identifier for the meeting"
      - name: host_id
        description: "ID of the meeting host"
      - name: meeting_topic
        description: "Topic of the meeting"
      - name: start_time
        description: "Start time of the meeting"
      - name: end_time
        description: "End time of the meeting"
      - name: duration_minutes
        description: "Duration of the meeting in minutes"
      - name: load_timestamp
        description: "Timestamp when the record was loaded"
      - name: update_timestamp
        description: "Timestamp when the record was last updated"
      - name: source_system
        description: "Source system of the data"
