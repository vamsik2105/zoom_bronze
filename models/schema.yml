version: 2

models:
  - name: go_process_audit
    description: "Audit table for tracking Gold layer processing"
    columns:
      - name: process_id
        description: "Unique process identifier"
      - name: process_name
        description: "Name of the process"
      - name: source_table
        description: "Source table name"
      - name: target_table
        description: "Target table name"
      - name: process_status
        description: "Current process status"
      - name: start_time
        description: "Process start timestamp"
      - name: end_time
        description: "Process end timestamp"
      - name: records_processed
        description: "Number of records processed"
      - name: error_message
        description: "Error message if any"
      - name: load_date
        description: "Load date"
        
  - name: go_meeting_facts
    description: "Gold layer meeting facts table"
    columns:
      - name: meeting_fact_id
        description: "Unique meeting fact identifier"
      - name: meeting_id
        description: "Meeting identifier"
      - name: host_id
        description: "Meeting host identifier"
      - name: meeting_topic
        description: "Meeting topic"
      - name: start_time
        description: "Meeting start time"
      - name: end_time
        description: "Meeting end time"
      - name: duration_minutes
        description: "Meeting duration in minutes"
      - name: participant_count
        description: "Number of participants"
      - name: engagement_score
        description: "Meeting engagement score"
        
  - name: go_participant_facts
    description: "Gold layer participant facts table"
    columns:
      - name: participant_fact_id
        description: "Unique participant fact identifier"
      - name: meeting_id
        description: "Associated meeting identifier"
      - name: participant_id
        description: "Participant identifier"
      - name: user_id
        description: "User identifier"
      - name: attendance_duration
        description: "Attendance duration in minutes"
      - name: connection_quality_rating
        description: "Connection quality rating"
        
  - name: go_webinar_facts
    description: "Gold layer webinar facts table"
    columns:
      - name: webinar_fact_id
        description: "Unique webinar fact identifier"
      - name: webinar_id
        description: "Webinar identifier"
      - name: host_id
        description: "Webinar host identifier"
      - name: registrants_count
        description: "Number of registrants"
      - name: actual_attendees
        description: "Number of actual attendees"
      - name: attendance_rate
        description: "Attendance rate percentage"
        
  - name: go_billing_facts
    description: "Gold layer billing facts table"
    columns:
      - name: billing_fact_id
        description: "Unique billing fact identifier"
      - name: event_id
        description: "Billing event identifier"
      - name: user_id
        description: "User identifier"
      - name: amount
        description: "Billing amount"
      - name: event_date
        description: "Event date"
        
  - name: go_usage_facts
    description: "Gold layer usage facts table"
    columns:
      - name: usage_fact_id
        description: "Unique usage fact identifier"
      - name: user_id
        description: "User identifier"
      - name: usage_date
        description: "Usage date"
      - name: meeting_count
        description: "Number of meetings"
      - name: total_meeting_minutes
        description: "Total meeting minutes"
        
  - name: go_quality_facts
    description: "Gold layer quality facts table"
    columns:
      - name: quality_fact_id
        description: "Unique quality fact identifier"
      - name: meeting_id
        description: "Meeting identifier"
      - name: participant_id
        description: "Participant identifier"
      - name: audio_quality_score
        description: "Audio quality score"
      - name: video_quality_score
        description: "Video quality score"
      - name: connection_stability_rating
        description: "Connection stability rating"
