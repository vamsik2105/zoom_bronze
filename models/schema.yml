version: 2

models:
  - name: si_process_audit
    description: "Process audit table tracking ETL execution metrics and performance"
    columns:
      - name: execution_id
        description: "Unique identifier for each execution run"
        tests:
          - not_null
      - name: pipeline_name
        description: "Name of the pipeline being executed"
        tests:
          - not_null
      - name: status
        description: "Execution status (SUCCESS/FAILURE/RUNNING)"
        tests:
          - not_null
          - accepted_values:
              values: ['SUCCESS', 'FAILURE', 'RUNNING']
      - name: records_processed
        description: "Total number of records processed"
        tests:
          - not_null
      - name: records_successful
        description: "Number of records successfully processed"
        tests:
          - not_null
      - name: records_failed
        description: "Number of records that failed processing"
        tests:
          - not_null
  
  - name: si_data_quality_errors
    description: "Data quality errors captured during transformation process"
    columns:
      - name: error_id
        description: "Unique identifier for each error occurrence"
        tests:
          - not_null
      - name: source_table
        description: "Source table where error occurred"
        tests:
          - not_null
      - name: error_type
        description: "Type/category of the error"
        tests:
          - not_null
      - name: severity_level
        description: "Severity level of the error (LOW/MEDIUM/HIGH/CRITICAL)"
        tests:
          - not_null
          - accepted_values:
              values: ['LOW', 'MEDIUM', 'HIGH', 'CRITICAL']
      - name: resolution_status
        description: "Current status of error resolution"
        tests:
          - not_null
          - accepted_values:
              values: ['OPEN', 'IN_PROGRESS', 'RESOLVED', 'CLOSED']
  
  - name: si_users
    description: "Cleaned and validated user data from Zoom platform"
    columns:
      - name: user_id
        description: "Unique identifier for users"
        tests:
          - not_null
          - unique
      - name: user_name
        description: "User display name (cleaned and trimmed)"
        tests:
          - not_null
      - name: email
        description: "User email address (validated format, lowercase)"
        tests:
          - not_null
      - name: plan_type
        description: "User subscription plan type"
        tests:
          - not_null
          - accepted_values:
              values: ['Free', 'Pro', 'Business', 'Enterprise', 'Unknown']
      - name: record_status
        description: "Record processing status"
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'error']
      - name: data_quality_score
        description: "Data quality score (0.0 to 1.0)"
        tests:
          - not_null
  
  - name: si_meetings
    description: "Cleaned and validated meeting data"
    columns:
      - name: meeting_id
        description: "Unique identifier for meetings"
        tests:
          - not_null
          - unique
      - name: host_id
        description: "User ID of meeting host"
        tests:
          - not_null
      - name: duration_minutes
        description: "Meeting duration in minutes"
        tests:
          - not_null
      - name: record_status
        description: "Record processing status"
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'error']
  
  - name: si_participants
    description: "Cleaned and validated participant data"
    columns:
      - name: participant_id
        description: "Unique identifier for participants"
        tests:
          - not_null
          - unique
      - name: meeting_id
        description: "Meeting ID for participant"
        tests:
          - not_null
      - name: record_status
        description: "Record processing status"
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'error']
  
  - name: si_feature_usage
    description: "Cleaned and validated feature usage data"
    columns:
      - name: usage_id
        description: "Unique identifier for feature usage records"
        tests:
          - not_null
          - unique
      - name: feature_name
        description: "Name of the feature used (standardized)"
        tests:
          - not_null
          - accepted_values:
              values: ['Screen Sharing', 'Chat', 'Recording', 'Whiteboard', 'Virtual Background', 'Unknown Feature']
      - name: usage_count
        description: "Number of times feature was used"
        tests:
          - not_null
      - name: record_status
        description: "Record processing status"
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'error']
  
  - name: si_webinars
    description: "Cleaned and validated webinar data"
    columns:
      - name: webinar_id
        description: "Unique identifier for webinars"
        tests:
          - not_null
          - unique
      - name: host_id
        description: "User ID of webinar host"
        tests:
          - not_null
      - name: registrants
        description: "Number of webinar registrants"
        tests:
          - not_null
      - name: record_status
        description: "Record processing status"
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'error']
  
  - name: si_support_tickets
    description: "Cleaned and validated support ticket data"
    columns:
      - name: ticket_id
        description: "Unique identifier for support tickets"
        tests:
          - not_null
          - unique
      - name: ticket_type
        description: "Type of support ticket (standardized)"
        tests:
          - not_null
          - accepted_values:
              values: ['Audio Issue', 'Video Issue', 'Connectivity', 'Billing Inquiry', 'Feature Request', 'Account Access', 'Other']
      - name: resolution_status
        description: "Current status of ticket resolution (standardized)"
        tests:
          - not_null
          - accepted_values:
              values: ['Open', 'In Progress', 'Pending Customer', 'Closed', 'Resolved', 'Unknown']
      - name: record_status
        description: "Record processing status"
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'error']
  
  - name: si_licenses
    description: "Cleaned and validated license data"
    columns:
      - name: license_id
        description: "Unique identifier for licenses"
        tests:
          - not_null
          - unique
      - name: license_type
        description: "Type of license (standardized)"
        tests:
          - not_null
          - accepted_values:
              values: ['Pro', 'Business', 'Enterprise', 'Education', 'Unknown']
      - name: record_status
        description: "Record processing status"
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'error']
  
  - name: si_billing_events
    description: "Cleaned and validated billing event data"
    columns:
      - name: event_id
        description: "Unique identifier for billing events"
        tests:
          - not_null
          - unique
      - name: event_type
        description: "Type of billing event (standardized)"
        tests:
          - not_null
          - accepted_values:
              values: ['Subscription Fee', 'Subscription Renewal', 'Add-on Purchase', 'Refund', 'Other']
      - name: amount
        description: "Billing amount (validated non-negative)"
        tests:
          - not_null
      - name: record_status
        description: "Record processing status"
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'error']
