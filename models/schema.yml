version: 2

sources:
  - name: bronze
    description: "Bronze layer containing raw data from source systems"
    tables:
      - name: bz_users
        description: "Raw user data from Zoom platform"
        columns:
          - name: user_id
            description: "Unique identifier for user"
            tests:
              - not_null
              - unique
          - name: user_name
            description: "User display name"
          - name: email
            description: "User email address"
          - name: company
            description: "User company name"
          - name: plan_type
            description: "Zoom plan type"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"
            
      - name: bz_meetings
        description: "Raw meeting data from Zoom platform"
        columns:
          - name: meeting_id
            description: "Unique identifier for meeting"
            tests:
              - not_null
              - unique
          - name: host_id
            description: "Meeting host user ID"
          - name: meeting_topic
            description: "Meeting topic/title"
          - name: start_time
            description: "Meeting start timestamp"
          - name: end_time
            description: "Meeting end timestamp"
          - name: duration_minutes
            description: "Meeting duration in minutes"
            
      - name: bz_participants
        description: "Raw participant data from Zoom meetings"
        columns:
          - name: participant_id
            description: "Unique identifier for participant"
            tests:
              - not_null
              - unique
          - name: meeting_id
            description: "Associated meeting ID"
          - name: user_id
            description: "Participant user ID"
          - name: join_time
            description: "Time participant joined"
          - name: leave_time
            description: "Time participant left"
            
      - name: bz_feature_usage
        description: "Raw feature usage data from Zoom meetings"
        columns:
          - name: usage_id
            description: "Unique identifier for usage record"
            tests:
              - not_null
              - unique
          - name: meeting_id
            description: "Associated meeting ID"
          - name: feature_name
            description: "Name of feature used"
          - name: usage_count
            description: "Number of times feature was used"
          - name: usage_date
            description: "Date of feature usage"
            
      - name: bz_webinars
        description: "Raw webinar data from Zoom platform"
        columns:
          - name: webinar_id
            description: "Unique identifier for webinar"
            tests:
              - not_null
              - unique
          - name: host_id
            description: "Webinar host user ID"
          - name: webinar_topic
            description: "Webinar topic/title"
          - name: start_time
            description: "Webinar start timestamp"
          - name: end_time
            description: "Webinar end timestamp"
          - name: registrants
            description: "Number of webinar registrants"
            
      - name: bz_support_tickets
        description: "Raw support ticket data"
        columns:
          - name: ticket_id
            description: "Unique identifier for support ticket"
            tests:
              - not_null
              - unique
          - name: user_id
            description: "User who created the ticket"
          - name: ticket_type
            description: "Type of support ticket"
          - name: resolution_status
            description: "Current status of ticket resolution"
          - name: open_date
            description: "Date ticket was opened"
            
      - name: bz_licenses
        description: "Raw license data"
        columns:
          - name: license_id
            description: "Unique identifier for license"
            tests:
              - not_null
              - unique
          - name: license_type
            description: "Type of Zoom license"
          - name: assigned_to_user_id
            description: "User ID license is assigned to"
          - name: start_date
            description: "License start date"
          - name: end_date
            description: "License end date"
            
      - name: bz_billing_events
        description: "Raw billing event data"
        columns:
          - name: event_id
            description: "Unique identifier for billing event"
            tests:
              - not_null
              - unique
          - name: user_id
            description: "User associated with billing event"
          - name: event_type
            description: "Type of billing event"
          - name: amount
            description: "Billing amount"
          - name: event_date
            description: "Date of billing event"

models:
  - name: sv_process_audit
    description: "Process audit table for tracking ETL execution"
    columns:
      - name: execution_id
        description: "Unique identifier for execution"
        tests:
          - not_null
      - name: pipeline_name
        description: "Name of the pipeline/model"
        tests:
          - not_null
      - name: start_time
        description: "Process start timestamp"
      - name: end_time
        description: "Process end timestamp"
      - name: status
        description: "Process execution status"
        tests:
          - accepted_values:
              values: ['RUNNING', 'SUCCESS', 'FAILED']
      - name: records_processed
        description: "Total number of records processed"
      - name: records_successful
        description: "Number of successful records"
      - name: records_failed
        description: "Number of failed records"
        
  - name: sv_data_quality_errors
    description: "Data quality errors tracking table"
    columns:
      - name: error_id
        description: "Unique identifier for error"
        tests:
          - not_null
      - name: source_table
        description: "Source table where error occurred"
        tests:
          - not_null
      - name: error_type
        description: "Type of data quality error"
      - name: severity_level
        description: "Error severity level"
        tests:
          - accepted_values:
              values: ['LOW', 'MEDIUM', 'HIGH', 'CRITICAL']
              
  - name: sv_users
    description: "Silver layer users table with cleaned and validated data"
    columns:
      - name: user_id
        description: "Unique identifier for user"
        tests:
          - not_null
          - unique
      - name: user_name
        description: "Cleaned user display name"
        tests:
          - not_null
      - name: email
        description: "Validated and normalized email address"
        tests:
          - not_null
          - unique
      - name: plan_type
        description: "Standardized plan type"
        tests:
          - accepted_values:
              values: ['FREE', 'PRO', 'BUSINESS', 'ENTERPRISE']
      - name: data_quality_score
        description: "Data quality score (0.0 to 1.0)"
        tests:
          - not_null
      - name: record_status
        description: "Record processing status"
        tests:
          - accepted_values:
              values: ['active', 'error']
