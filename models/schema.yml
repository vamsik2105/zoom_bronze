version: 2

sources:
  - name: silver_layer
    description: "Silver layer tables containing cleaned and validated data"
    tables:
      - name: si_users
        description: "Silver users table with user information"
        columns:
          - name: user_id
            description: "Unique identifier for user"
            tests:
              - unique
              - not_null
          - name: user_name
            description: "User display name"
          - name: email
            description: "User email address"
          - name: company
            description: "User company name"
          - name: plan_type
            description: "User subscription plan type"
          - name: record_status
            description: "Record status (ACTIVE/INACTIVE)"
            
      - name: si_meetings
        description: "Silver meetings table with meeting information"
        columns:
          - name: meeting_id
            description: "Unique identifier for meeting"
            tests:
              - unique
              - not_null
          - name: host_id
            description: "Meeting host user ID"
          - name: meeting_topic
            description: "Meeting topic/title"
          - name: start_time
            description: "Meeting start timestamp"
          - name: end_time
            description: "Meeting end timestamp"
          - name: duration_minutes
            description: "Meeting duration in minutes"
            
      - name: si_participants
        description: "Silver participants table with meeting participation data"
        columns:
          - name: participant_id
            description: "Unique identifier for participant"
            tests:
              - unique
              - not_null
          - name: meeting_id
            description: "Associated meeting ID"
          - name: user_id
            description: "Participant user ID"
          - name: join_time
            description: "Participant join timestamp"
          - name: leave_time
            description: "Participant leave timestamp"
            
      - name: si_feature_usage
        description: "Silver feature usage table with feature utilization data"
        columns:
          - name: usage_id
            description: "Unique identifier for usage record"
            tests:
              - unique
              - not_null
          - name: meeting_id
            description: "Associated meeting ID"
          - name: feature_name
            description: "Name of the feature used"
          - name: usage_count
            description: "Number of times feature was used"
          - name: usage_date
            description: "Date of feature usage"
            
      - name: si_webinars
        description: "Silver webinars table with webinar information"
        columns:
          - name: webinar_id
            description: "Unique identifier for webinar"
            tests:
              - unique
              - not_null
          - name: host_id
            description: "Webinar host user ID"
          - name: webinar_topic
            description: "Webinar topic/title"
          - name: start_time
            description: "Webinar start timestamp"
          - name: end_time
            description: "Webinar end timestamp"
          - name: registrants
            description: "Number of webinar registrants"
            
      - name: si_support_tickets
        description: "Silver support tickets table with customer support data"
        columns:
          - name: ticket_id
            description: "Unique identifier for support ticket"
            tests:
              - unique
              - not_null
          - name: user_id
            description: "User who created the ticket"
          - name: ticket_type
            description: "Type/category of support ticket"
          - name: resolution_status
            description: "Current status of ticket resolution"
          - name: open_date
            description: "Date when ticket was opened"
            
      - name: si_licenses
        description: "Silver licenses table with license assignment data"
        columns:
          - name: license_id
            description: "Unique identifier for license"
            tests:
              - unique
              - not_null
          - name: license_type
            description: "Type of license"
          - name: assigned_to_user_id
            description: "User ID to whom license is assigned"
          - name: start_date
            description: "License start date"
          - name: end_date
            description: "License end date"
            
      - name: si_billing_events
        description: "Silver billing events table with billing transaction data"
        columns:
          - name: event_id
            description: "Unique identifier for billing event"
            tests:
              - unique
              - not_null
          - name: user_id
            description: "User associated with billing event"
          - name: event_type
            description: "Type of billing event"
          - name: amount
            description: "Billing amount"
          - name: event_date
            description: "Date of billing event"

models:
  - name: go_process_audit
    description: "Gold layer process audit table for tracking ETL processes"
    columns:
      - name: process_id
        description: "Unique identifier for process execution"
        tests:
          - unique
          - not_null
      - name: process_name
        description: "Name of the process being executed"
      - name: source_table
        description: "Source table name"
      - name: target_table
        description: "Target table name"
      - name: process_status
        description: "Status of process (STARTED/COMPLETED/FAILED)"
      - name: start_time
        description: "Process start timestamp"
      - name: end_time
        description: "Process end timestamp"
      - name: records_processed
        description: "Number of records processed"
      - name: error_message
        description: "Error message if process failed"
        
  - name: go_user_dimension
    description: "Gold layer user dimension table"
    columns:
      - name: user_dim_id
        description: "Surrogate key for user dimension"
        tests:
          - unique
          - not_null
      - name: user_id
        description: "Business key - original user ID"
        tests:
          - unique
          - not_null
      - name: user_name
        description: "User display name"
      - name: email_address
        description: "User email address"
      - name: user_type
        description: "Categorized user type based on plan"
      - name: account_status
        description: "Current account status"
      - name: license_type
        description: "Current license type assigned to user"
        
  - name: go_organization_dimension
    description: "Gold layer organization dimension table"
    columns:
      - name: organization_dim_id
        description: "Surrogate key for organization dimension"
        tests:
          - unique
          - not_null
      - name: organization_id
        description: "Business key - organization ID"
      - name: organization_name
        description: "Organization name"
        
  - name: go_time_dimension
    description: "Gold layer time dimension table"
    columns:
      - name: time_dim_id
        description: "Surrogate key for time dimension"
        tests:
          - unique
          - not_null
      - name: date_key
        description: "Date value"
        tests:
          - unique
          - not_null
      - name: year_number
        description: "Year number"
      - name: quarter_number
        description: "Quarter number (1-4)"
      - name: month_number
        description: "Month number (1-12)"
      - name: month_name
        description: "Month name"
      - name: week_number
        description: "Week number in year"
      - name: day_of_year
        description: "Day number in year (1-366)"
      - name: day_of_month
        description: "Day number in month (1-31)"
      - name: day_of_week
        description: "Day number in week (0-6)"
      - name: day_name
        description: "Day name"
      - name: is_weekend
        description: "Boolean flag for weekend days"
      - name: is_holiday
        description: "Boolean flag for holiday days"
      - name: fiscal_year
        description: "Fiscal year number"
      - name: fiscal_quarter
        description: "Fiscal quarter number"
        
  - name: go_device_dimension
    description: "Gold layer device dimension table"
    columns:
      - name: device_dim_id
        description: "Surrogate key for device dimension"
        tests:
          - unique
          - not_null
      - name: device_connection_id
        description: "Device connection identifier"
      - name: device_type
        description: "Type of device"
      - name: operating_system
        description: "Operating system of device"
      - name: application_version
        description: "Application version"
      - name: network_connection_type
        description: "Type of network connection"
      - name: device_category
        description: "Category of device"
      - name: platform_family
        description: "Platform family"
        
  - name: go_geography_dimension
    description: "Gold layer geography dimension table"
    columns:
      - name: geography_dim_id
        description: "Surrogate key for geography dimension"
        tests:
          - unique
          - not_null
      - name: country_code
        description: "ISO country code"
      - name: country_name
        description: "Country name"
      - name: region_name
        description: "Region name"
      - name: time_zone
        description: "Time zone"
      - name: continent
        description: "Continent name"
