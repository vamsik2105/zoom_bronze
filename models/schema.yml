version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: users
        columns:
          - name: user_id
          - name: user_name
          - name: email
          - name: company
          - name: plan_type
      - name: meetings
        columns:
          - name: meeting_id
          - name: host_id
          - name: meeting_topic
          - name: start_time
          - name: end_time
          - name: duration_minutes
      - name: participants
        columns:
          - name: participant_id
          - name: meeting_id
          - name: user_id
          - name: join_time
          - name: leave_time
      - name: feature_usage
        columns:
          - name: usage_id
          - name: meeting_id
          - name: feature_name
          - name: usage_count
          - name: usage_date
      - name: webinars
        columns:
          - name: webinar_id
          - name: host_id
          - name: webinar_topic
          - name: start_time
          - name: end_time
          - name: registrants
      - name: support_tickets
        columns:
          - name: ticket_id
          - name: user_id
          - name: ticket_type
          - name: resolution_status
          - name: open_date
      - name: licenses
        columns:
          - name: license_id
          - name: license_type
          - name: assigned_to_user_id
          - name: start_date
          - name: end_date
      - name: billing_events
        columns:
          - name: event_id
          - name: user_id
          - name: event_type
          - name: amount
          - name: event_date

models:
  - name: bz_audit_log
    description: "Audit log for tracking data processing"
    columns:
      - name: record_id
        description: "Unique identifier for the audit record"
      - name: source_table
        description: "Name of the source table being processed"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: processed_by
        description: "User or process that processed the data"
      - name: processing_time
        description: "Time taken to process the data in seconds"
      - name: status
        description: "Status of the processing (success/failure)"

  - name: bz_users
    description: "Bronze layer for user data"
    columns:
      - name: user_id
        description: "Unique identifier for the user"
      - name: user_name
        description: "Name of the user"
      - name: email
        description: "Email address of the user"
      - name: company
        description: "Company the user belongs to"
      - name: plan_type
        description: "Type of plan the user has"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: update_timestamp
        description: "Timestamp when the data was last updated"
      - name: source_system
        description: "Source system of the data"

  - name: bz_meetings
    description: "Bronze layer for meeting data"
    columns:
      - name: meeting_id
        description: "Unique identifier for the meeting"
      - name: host_id
        description: "Identifier of the meeting host"
      - name: meeting_topic
        description: "Topic of the meeting"
      - name: start_time
        description: "Start time of the meeting"
      - name: end_time
        description: "End time of the meeting"
      - name: duration_minutes
        description: "Duration of the meeting in minutes"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: update_timestamp
        description: "Timestamp when the data was last updated"
      - name: source_system
        description: "Source system of the data"

  - name: bz_participants
    description: "Bronze layer for participant data"
    columns:
      - name: participant_id
        description: "Unique identifier for the participant"
      - name: meeting_id
        description: "Identifier of the meeting"
      - name: user_id
        description: "Identifier of the user"
      - name: join_time
        description: "Time when the participant joined the meeting"
      - name: leave_time
        description: "Time when the participant left the meeting"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: update_timestamp
        description: "Timestamp when the data was last updated"
      - name: source_system
        description: "Source system of the data"

  - name: bz_feature_usage
    description: "Bronze layer for feature usage data"
    columns:
      - name: usage_id
        description: "Unique identifier for the feature usage"
      - name: meeting_id
        description: "Identifier of the meeting"
      - name: feature_name
        description: "Name of the feature"
      - name: usage_count
        description: "Count of feature usage"
      - name: usage_date
        description: "Date of feature usage"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: update_timestamp
        description: "Timestamp when the data was last updated"
      - name: source_system
        description: "Source system of the data"

  - name: bz_webinars
    description: "Bronze layer for webinar data"
    columns:
      - name: webinar_id
        description: "Unique identifier for the webinar"
      - name: host_id
        description: "Identifier of the webinar host"
      - name: webinar_topic
        description: "Topic of the webinar"
      - name: start_time
        description: "Start time of the webinar"
      - name: end_time
        description: "End time of the webinar"
      - name: registrants
        description: "Number of registrants for the webinar"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: update_timestamp
        description: "Timestamp when the data was last updated"
      - name: source_system
        description: "Source system of the data"

  - name: bz_support_tickets
    description: "Bronze layer for support ticket data"
    columns:
      - name: ticket_id
        description: "Unique identifier for the support ticket"
      - name: user_id
        description: "Identifier of the user who created the ticket"
      - name: ticket_type
        description: "Type of the support ticket"
      - name: resolution_status
        description: "Status of ticket resolution"
      - name: open_date
        description: "Date when the ticket was opened"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: update_timestamp
        description: "Timestamp when the data was last updated"
      - name: source_system
        description: "Source system of the data"

  - name: bz_licenses
    description: "Bronze layer for license data"
    columns:
      - name: license_id
        description: "Unique identifier for the license"
      - name: license_type
        description: "Type of the license"
      - name: assigned_to_user_id
        description: "Identifier of the user the license is assigned to"
      - name: start_date
        description: "Start date of the license"
      - name: end_date
        description: "End date of the license"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: update_timestamp
        description: "Timestamp when the data was last updated"
      - name: source_system
        description: "Source system of the data"

  - name: bz_billing_events
    description: "Bronze layer for billing event data"
    columns:
      - name: event_id
        description: "Unique identifier for the billing event"
      - name: user_id
        description: "Identifier of the user associated with the billing event"
      - name: event_type
        description: "Type of the billing event"
      - name: amount
        description: "Amount associated with the billing event"
      - name: event_date
        description: "Date of the billing event"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: update_timestamp
        description: "Timestamp when the data was last updated"
      - name: source_system
        description: "Source system of the data"
