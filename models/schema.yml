version: 2

sources:
  - name: silver
    description: "Silver layer containing cleaned and validated data"
    tables:
      - name: si_users
        description: "Silver users table with user information"
        columns:
          - name: user_id
            description: "Unique identifier for user"
          - name: user_name
            description: "User display name"
          - name: email
            description: "User email address"
          - name: company
            description: "User company"
          - name: plan_type
            description: "User subscription plan type"
          - name: record_status
            description: "Record status (ACTIVE/INACTIVE)"
      
      - name: si_meetings
        description: "Silver meetings table with meeting information"
        columns:
          - name: meeting_id
            description: "Unique identifier for meeting"
          - name: host_id
            description: "Meeting host user ID"
          - name: start_time
            description: "Meeting start timestamp"
          - name: end_time
            description: "Meeting end timestamp"
      
      - name: si_participants
        description: "Silver participants table with participant information"
        columns:
          - name: participant_id
            description: "Unique identifier for participant"
          - name: meeting_id
            description: "Associated meeting ID"
          - name: user_id
            description: "Participant user ID"
      
      - name: si_licenses
        description: "Silver licenses table with license information"
        columns:
          - name: license_id
            description: "Unique identifier for license"
          - name: assigned_to_user_id
            description: "User ID assigned to license"
          - name: license_type
            description: "Type of license"

models:
  - name: go_process_audit
    description: "Process audit table for tracking transformation processes"
    columns:
      - name: process_id
        description: "Unique process identifier"
        data_type: varchar(255)
      - name: process_name
        description: "Name of the transformation process"
        data_type: varchar(255)
      - name: source_table
        description: "Source table name"
        data_type: varchar(255)
      - name: target_table
        description: "Target table name"
        data_type: varchar(255)
      - name: process_status
        description: "Process execution status"
        data_type: varchar(255)
      - name: start_time
        description: "Process start timestamp"
      - name: end_time
        description: "Process end timestamp"
      - name: records_processed
        description: "Number of records processed"
      - name: error_message
        description: "Error message if process failed"
        data_type: varchar(255)

  - name: go_user_dimension
    description: "Gold user dimension table"
    columns:
      - name: user_dim_id
        description: "Surrogate key for user dimension"
      - name: user_id
        description: "Business key for user"
      - name: user_name
        description: "User display name"
      - name: email_address
        description: "User email address"
      - name: user_type
        description: "Categorized user type"
      - name: account_status
        description: "Account status"

  - name: go_organization_dimension
    description: "Gold organization dimension table"
    columns:
      - name: organization_dim_id
        description: "Surrogate key for organization dimension"
      - name: organization_id
        description: "Business key for organization"
      - name: organization_name
        description: "Organization name"

  - name: go_time_dimension
    description: "Gold time dimension table"
    columns:
      - name: time_dim_id
        description: "Surrogate key for time dimension"
      - name: date_key
        description: "Date key"
      - name: year_number
        description: "Year number"
      - name: month_number
        description: "Month number"

  - name: go_device_dimension
    description: "Gold device dimension table"
    columns:
      - name: device_dim_id
        description: "Surrogate key for device dimension"
      - name: device_connection_id
        description: "Device connection identifier"

  - name: go_geography_dimension
    description: "Gold geography dimension table"
    columns:
      - name: geography_dim_id
        description: "Surrogate key for geography dimension"
      - name: country_code
        description: "Country code"
      - name: country_name
        description: "Country name"
