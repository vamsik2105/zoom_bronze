version: 2

sources:
  - name: bronze
    description: "Bronze layer containing raw data from source systems"
    tables:
      - name: bz_users
        description: "Raw user data from Zoom platform"
        columns:
          - name: user_id
            description: "Unique identifier for user"
          - name: user_name
            description: "User display name"
          - name: email
            description: "User email address"
          - name: company
            description: "User company name"
          - name: plan_type
            description: "Zoom plan type"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"

models:
  - name: sv_process_audit
    description: "Process audit table for tracking ETL execution"
    columns:
      - name: execution_id
        description: "Unique identifier for execution"
      - name: pipeline_name
        description: "Name of the pipeline/model"
      - name: start_time
        description: "Process start timestamp"
      - name: end_time
        description: "Process end timestamp"
      - name: status
        description: "Process execution status"
      - name: records_processed
        description: "Total number of records processed"
      - name: records_successful
        description: "Number of successful records"
      - name: records_failed
        description: "Number of failed records"
        
  - name: sv_data_quality_errors
    description: "Data quality errors tracking table"
    columns:
      - name: error_id
        description: "Unique identifier for error"
      - name: source_table
        description: "Source table where error occurred"
      - name: error_type
        description: "Type of data quality error"
      - name: severity_level
        description: "Error severity level"
              
  - name: sv_users
    description: "Silver layer users table with cleaned and validated data"
    columns:
      - name: user_id
        description: "Unique identifier for user"
      - name: user_name
        description: "Cleaned user display name"
      - name: email
        description: "Validated and normalized email address"
      - name: plan_type
        description: "Standardized plan type"
      - name: data_quality_score
        description: "Data quality score (0.0 to 1.0)"
      - name: record_status
        description: "Record processing status"
