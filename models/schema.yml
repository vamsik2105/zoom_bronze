version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: users
      - name: meetings
      - name: participants
      - name: feature_usage
      - name: webinars
      - name: support_tickets
      - name: licenses
      - name: billing_events

models:
  - name: bz_users
    description: "Bronze layer for user data"
    columns:
      - name: user_id
        description: "Unique identifier for the user"
      - name: user_name
        description: "Name of the user"
      - name: email
        description: "Email address of the user"
      - name: company
        description: "Company the user belongs to"
      - name: plan_type
        description: "Type of plan the user has"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: update_timestamp
        description: "Timestamp when the data was last updated"
      - name: source_system
        description: "Source system of the data"

  - name: bz_meetings
    description: "Bronze layer for meeting data"
    columns:
      - name: meeting_id
        description: "Unique identifier for the meeting"
      - name: host_id
        description: "Identifier of the meeting host"
      - name: meeting_topic
        description: "Topic of the meeting"
      - name: start_time
        description: "Start time of the meeting"
      - name: end_time
        description: "End time of the meeting"
      - name: duration_minutes
        description: "Duration of the meeting in minutes"
      - name: load_timestamp
        description: "Timestamp when the data was loaded"
      - name: update_timestamp
        description: "Timestamp when the data was last updated"
      - name: source_system
        description: "Source system of the data"
