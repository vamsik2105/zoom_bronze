version: 2

sources:
  - name: raw
    description: "Raw data layer containing unprocessed customer information"
    tables:
      - name: customer_details
        description: "Raw customer details from source systems"
        columns:
          - name: customer_id
            description: "Unique identifier for the customer"
            tests:
              - not_null
              - unique
          - name: customer_name
            description: "Name of the customer"
            tests:
              - not_null
          - name: email
            description: "Email address of the customer"
          - name: created_date
            description: "Date the customer record was created"

models:
  - name: audit_log
    description: "Audit log table for tracking bronze layer transformations"
    columns:
      - name: table_name
        description: "Name of the table being processed"
        tests:
          - not_null
      - name: process_status
        description: "Status of the transformation process"
        tests:
          - not_null
          - accepted_values:
              values: ['STARTED', 'COMPLETED', 'FAILED', 'INITIALIZED']
      - name: process_start_time
        description: "Timestamp when the process started"
      - name: process_end_time
        description: "Timestamp when the process ended"
      - name: record_count
        description: "Number of records processed"
      - name: created_at
        description: "Audit timestamp for when the log entry was created"
        tests:
          - not_null

  - name: customer_details_brz
    description: "Bronze layer customer details with data quality validations applied"
    columns:
      - name: customer_id
        description: "Unique identifier for the customer (cleaned and validated)"
        tests:
          - not_null
          - unique
      - name: customer_name
        description: "Name of the customer (trimmed and validated)"
        tests:
          - not_null
      - name: email
        description: "Email address of the customer (normalized to lowercase)"
      - name: created_date
        description: "Date the customer record was created in source system"
      - name: created_at
        description: "Timestamp when record was processed into bronze layer"
        tests:
          - not_null
      - name: updated_at
        description: "Timestamp when record was last updated in bronze layer"
        tests:
          - not_null
      - name: process_status
        description: "Processing status of the record"
        tests:
          - not_null
          - accepted_values:
              values: ['ACTIVE', 'INACTIVE', 'ERROR']