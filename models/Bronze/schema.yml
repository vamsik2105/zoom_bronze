version: 2
 
sources:
  - name: raw
    description: "Raw data layer containing unprocessed data from source systems"
    tables:
      - name: customer_details
        description: "Raw customer details data from source system"
        columns:
          - name: customer_id
            description: "Unique identifier for the customer"
            tests:
              - not_null
              - unique
 
          - name: customer_name
            description: "Name of the customer"
            tests:
              - not_null
 
          - name: email
            description: "Email address of the customer"
 
          - name: created_date
            description: "Date the customer record was created"
 
models:
  - name: customer_details_brz
    description: "Bronze layer customer details with data quality validations and audit information"
    columns:
      - name: customer_id
        description: "Unique identifier for the customer (Primary Key)"
        data_type: int
        tests:
          - not_null
          - unique
 
      - name: customer_name
        description: "Cleaned and standardized customer name (uppercase, trimmed)"
        data_type: string
        tests:
          - not_null
 
      - name: email
        description: "Validated and cleaned email address (lowercase, trimmed)"
        data_type: string
        tests:
          - accepted_values:
              values: ['INVALID_EMAIL']
              quote: false
              severity: warn
 
      - name: created_date
        description: "Date the customer record was created (validated for future dates)"
        data_type: date
        tests:
          - not_null
 
      - name: created_at
        description: "Timestamp when the bronze record was created"
        data_type: timestamp
        tests:
          - not_null
 
      - name: updated_at
        description: "Timestamp when the bronze record was last updated"
        data_type: timestamp
        tests:
          - not_null
 
      - name: process_status
        description: "Data quality status flag indicating validation results"
        data_type: string
        tests:
          - not_null
          - accepted_values:
              values: ['VALID', 'MISSING_ID', 'MISSING_NAME', 'INVALID_EMAIL_FORMAT', 'FUTURE_DATE']
 
      - name: dbt_run_timestamp
        description: "DBT run start timestamp for audit purposes"
        data_type: string
        tests:
          - not_null
 
      - name: dbt_invocation_id
        description: "DBT invocation ID for tracking specific runs"
        data_type: string
        tests:
          - not_null
 
      - name: extraction_timestamp
        description: "Timestamp when data was extracted from source"
        data_type: timestamp
        tests:
          - not_null
 
      - name: processing_stage
        description: "Identifier for the processing stage (bronze_layer_processing)"
        data_type: string
        tests:
          - not_null
          - accepted_values:
              values: ['bronze_layer_processing']
 
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - customer_id
            - dbt_invocation_id