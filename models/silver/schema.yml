version: 2

models:
  - name: sv_audit_log
    description: "Audit log for tracking all transformation processes"
    columns:
      - name: record_id
        description: "Auto-incrementing record identifier"
        tests:
          - not_null
          - unique
      - name: source_table
        description: "Name of the source table being processed"
        tests:
          - not_null
      - name: load_timestamp
        description: "Timestamp of the process"
        tests:
          - not_null
      - name: processed_by
        description: "System or user that processed the data"
      - name: processing_time
        description: "Time taken to process in seconds"
      - name: status
        description: "Status of the processing (STARTED, COMPLETED, FAILED)"
        tests:
          - not_null

  - name: sv_data_quality_errors
    description: "Data quality errors captured during transformation"
    columns:
      - name: error_id
        description: "Unique identifier for error records"
        tests:
          - not_null
          - unique
      - name: source_table
        description: "Source table where error occurred"
        tests:
          - not_null
      - name: source_column
        description: "Source column where error occurred"
      - name: error_type
        description: "Type of error encountered"
        tests:
          - not_null
      - name: error_description
        description: "Detailed description of the error"
      - name: error_value
        description: "Value that caused the error"
      - name: expected_format
        description: "Expected format or rule"
      - name: record_identifier
        description: "Identifier of the record with error"
      - name: error_timestamp
        description: "Timestamp when error occurred"
        tests:
          - not_null
      - name: severity_level
        description: "Severity level of the error"
      - name: resolution_status
        description: "Status of error resolution"

  - name: sv_users
    description: "Silver layer users table with cleaned and validated data"
    columns:
      - name: user_id
        description: "Unique identifier for users"
        tests:
          - not_null
          - unique
      - name: user_name
        description: "Cleaned user name"
      - name: email
        description: "Validated and standardized email address"
        tests:
          - not_null
      - name: company
        description: "Company name (cleaned)"
      - name: plan_type
        description: "Standardized plan type"
        tests:
          - accepted_values:
              values: ['Free', 'Pro', 'Business', 'Enterprise']
      - name: load_date
        description: "Date when record was loaded"
        tests:
          - not_null
      - name: update_date
        description: "Date when record was last updated"
        tests:
          - not_null
      - name: data_quality_score
        description: "Data quality score (0.0 to 1.0)"
        tests:
          - not_null
      - name: record_status
        description: "Status of the record"
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'error', 'inactive']

  - name: sv_meetings
    description: "Silver layer meetings table with cleaned and validated data"
    columns:
      - name: meeting_id
        description: "Unique identifier for meetings"
        tests:
          - not_null
          - unique
      - name: host_id
        description: "User ID of the meeting host"
        tests:
          - not_null
      - name: meeting_topic
        description: "Cleaned meeting topic"
      - name: start_time
        description: "Meeting start timestamp"
        tests:
          - not_null
      - name: end_time
        description: "Meeting end timestamp"
        tests:
          - not_null
      - name: duration_minutes
        description: "Duration in minutes (validated range)"
        tests:
          - not_null
      - name: data_quality_score
        description: "Data quality score (0.0 to 1.0)"
        tests:
          - not_null
      - name: record_status
        description: "Status of the record"
        tests:
          - not_null

  - name: sv_participants
    description: "Silver layer participants table with cleaned and validated data"
    columns:
      - name: participant_id
        description: "Unique identifier for participants"
        tests:
          - not_null
          - unique
      - name: meeting_id
        description: "Meeting identifier"
        tests:
          - not_null
      - name: user_id
        description: "User identifier for participant"
      - name: join_time
        description: "Time participant joined (validated)"
        tests:
          - not_null
      - name: leave_time
        description: "Time participant left (validated)"
        tests:
          - not_null
      - name: data_quality_score
        description: "Data quality score (0.0 to 1.0)"
        tests:
          - not_null
      - name: record_status
        description: "Status of the record"
        tests:
          - not_null

  - name: sv_feature_usage
    description: "Silver layer feature usage table with cleaned and validated data"
    columns:
      - name: usage_id
        description: "Unique identifier for usage records"
        tests:
          - not_null
          - unique
      - name: meeting_id
        description: "Meeting identifier"
        tests:
          - not_null
      - name: feature_name
        description: "Standardized feature name"
        tests:
          - not_null
          - accepted_values:
              values: ['Screen Sharing', 'Chat', 'Recording', 'Whiteboard', 'Virtual Background']
      - name: usage_count
        description: "Number of times feature was used (validated)"
        tests:
          - not_null
      - name: usage_date
        description: "Date of feature usage"
        tests:
          - not_null
      - name: data_quality_score
        description: "Data quality score (0.0 to 1.0)"
        tests:
          - not_null
      - name: record_status
        description: "Status of the record"
        tests:
          - not_null

  - name: sv_webinars
    description: "Silver layer webinars table with cleaned and validated data"
    columns:
      - name: webinar_id
        description: "Unique identifier for webinars"
        tests:
          - not_null
          - unique
      - name: host_id
        description: "User ID of the webinar host"
        tests:
          - not_null
      - name: webinar_topic
        description: "Cleaned webinar topic"
        tests:
          - not_null
      - name: start_time
        description: "Webinar start timestamp"
        tests:
          - not_null
      - name: end_time
        description: "Webinar end timestamp"
        tests:
          - not_null
      - name: registrants
        description: "Number of registrants (validated)"
        tests:
          - not_null
      - name: data_quality_score
        description: "Data quality score (0.0 to 1.0)"
        tests:
          - not_null
      - name: record_status
        description: "Status of the record"
        tests:
          - not_null

  - name: sv_support_tickets
    description: "Silver layer support tickets table with cleaned and validated data"
    columns:
      - name: ticket_id
        description: "Unique identifier for support tickets"
        tests:
          - not_null
          - unique
      - name: user_id
        description: "User ID who created the ticket"
        tests:
          - not_null
      - name: ticket_type
        description: "Standardized ticket type"
        tests:
          - not_null
          - accepted_values:
              values: ['Audio Issue', 'Video Issue', 'Connectivity', 'Billing Inquiry', 'Feature Request', 'Account Access']
      - name: resolution_status
        description: "Standardized resolution status"
        tests:
          - not_null
          - accepted_values:
              values: ['Open', 'In Progress', 'Pending Customer', 'Closed', 'Resolved']
      - name: open_date
        description: "Date ticket was opened"
        tests:
          - not_null
      - name: data_quality_score
        description: "Data quality score (0.0 to 1.0)"
        tests:
          - not_null
      - name: record_status
        description: "Status of the record"
        tests:
          - not_null

  - name: sv_licenses
    description: "Silver layer licenses table with cleaned and validated data"
    columns:
      - name: license_id
        description: "Unique identifier for licenses"
        tests:
          - not_null
          - unique
      - name: license_type
        description: "Standardized license type"
        tests:
          - not_null
          - accepted_values:
              values: ['Pro', 'Business', 'Enterprise', 'Education']
      - name: assigned_to_user_id
        description: "User ID license is assigned to"
      - name: start_date
        description: "License start date"
        tests:
          - not_null
      - name: end_date
        description: "License end date"
        tests:
          - not_null
      - name: data_quality_score
        description: "Data quality score (0.0 to 1.0)"
        tests:
          - not_null
      - name: record_status
        description: "Status of the record"
        tests:
          - not_null

  - name: sv_billing_events
    description: "Silver layer billing events table with cleaned and validated data"
    columns:
      - name: event_id
        description: "Unique identifier for billing events"
        tests:
          - not_null
          - unique
      - name: user_id
        description: "User ID associated with billing event"
        tests:
          - not_null
      - name: event_type
        description: "Standardized event type"
        tests:
          - not_null
          - accepted_values:
              values: ['Subscription Fee', 'Subscription Renewal', 'Add-on Purchase', 'Refund']
      - name: amount
        description: "Amount of the billing event (validated)"
        tests:
          - not_null
      - name: event_date
        description: "Date of the billing event"
        tests:
          - not_null
      - name: data_quality_score
        description: "Data quality score (0.0 to 1.0)"
        tests:
          - not_null
      - name: record_status
        description: "Status of the record"
        tests:
          - not_null
