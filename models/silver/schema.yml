version: 2

sources:
  - name: bronze
    description: "Bronze layer containing raw data from various source systems"
    tables:
      - name: bz_users
        description: "Raw user data from source systems"
        columns:
          - name: user_id
            description: "Unique identifier for users"
          - name: user_name
            description: "User display name"
          - name: email
            description: "User email address"
          - name: company
            description: "User company name"
          - name: plan_type
            description: "User subscription plan type"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"
      
      - name: bz_meetings
        description: "Raw meeting data from source systems"
        columns:
          - name: meeting_id
            description: "Unique identifier for meetings"
          - name: host_id
            description: "User ID of meeting host"
          - name: meeting_topic
            description: "Meeting topic or title"
          - name: start_time
            description: "Meeting start timestamp"
          - name: end_time
            description: "Meeting end timestamp"
          - name: duration_minutes
            description: "Meeting duration in minutes"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"
      
      - name: bz_participants
        description: "Raw participant data from source systems"
        columns:
          - name: participant_id
            description: "Unique identifier for participants"
          - name: meeting_id
            description: "Meeting identifier"
          - name: user_id
            description: "User identifier for participant"
          - name: join_time
            description: "Participant join timestamp"
          - name: leave_time
            description: "Participant leave timestamp"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"
      
      - name: bz_feature_usage
        description: "Raw feature usage data from source systems"
        columns:
          - name: usage_id
            description: "Unique identifier for usage records"
          - name: meeting_id
            description: "Meeting identifier"
          - name: feature_name
            description: "Name of feature used"
          - name: usage_count
            description: "Number of times feature was used"
          - name: usage_date
            description: "Date of feature usage"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"
      
      - name: bz_webinars
        description: "Raw webinar data from source systems"
        columns:
          - name: webinar_id
            description: "Unique identifier for webinars"
          - name: host_id
            description: "User ID of webinar host"
          - name: webinar_topic
            description: "Webinar topic or title"
          - name: start_time
            description: "Webinar start timestamp"
          - name: end_time
            description: "Webinar end timestamp"
          - name: registrants
            description: "Number of webinar registrants"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"
      
      - name: bz_support_tickets
        description: "Raw support ticket data from source systems"
        columns:
          - name: ticket_id
            description: "Unique identifier for support tickets"
          - name: user_id
            description: "User identifier for ticket creator"
          - name: ticket_type
            description: "Type of support ticket"
          - name: resolution_status
            description: "Current status of ticket resolution"
          - name: open_date
            description: "Date when ticket was opened"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"
      
      - name: bz_licenses
        description: "Raw license data from source systems"
        columns:
          - name: license_id
            description: "Unique identifier for licenses"
          - name: license_type
            description: "Type of license"
          - name: assigned_to_user_id
            description: "User ID license is assigned to"
          - name: start_date
            description: "License start date"
          - name: end_date
            description: "License end date"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"
      
      - name: bz_billing_events
        description: "Raw billing event data from source systems"
        columns:
          - name: event_id
            description: "Unique identifier for billing events"
          - name: user_id
            description: "User identifier for billing event"
          - name: event_type
            description: "Type of billing event"
          - name: amount
            description: "Billing event amount"
          - name: event_date
            description: "Date of billing event"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"

models:
  - name: si_process_audit
    description: "Process audit table for tracking ETL execution"
    columns:
      - name: execution_id
        description: "Unique identifier for each execution"
        tests:
          - not_null
      - name: pipeline_name
        description: "Name of the pipeline being executed"
        tests:
          - not_null
      - name: start_time
        description: "Pipeline execution start time"
      - name: end_time
        description: "Pipeline execution end time"
      - name: status
        description: "Execution status (SUCCESS/FAILURE)"
        tests:
          - not_null
      - name: source_system
        description: "Source system name"
      - name: target_system
        description: "Target system name"
      - name: process_type
        description: "Type of process (ETL/Validation)"
      - name: load_date
        description: "Date when audit record was created"
      - name: update_date
        description: "Date when audit record was last updated"

  - name: si_data_quality_errors
    description: "Data quality errors tracking table"
    columns:
      - name: error_id
        description: "Unique identifier for each error"
        tests:
          - not_null
      - name: source_table
        description: "Source table where error occurred"
        tests:
          - not_null
      - name: source_column
        description: "Source column where error occurred"
      - name: error_type
        description: "Type of error encountered"
        tests:
          - not_null
      - name: error_description
        description: "Detailed error description"
      - name: error_timestamp
        description: "Timestamp when error occurred"
      - name: severity_level
        description: "Error severity level"
      - name: resolution_status
        description: "Status of error resolution"
      - name: load_date
        description: "Date when error record was created"
      - name: update_date
        description: "Date when error record was last updated"

  - name: si_users
    description: "Silver layer users table with cleaned and validated data"
    columns:
      - name: user_id
        description: "Unique identifier for users"
        tests:
          - not_null
          - unique
      - name: user_name
        description: "User display name (trimmed)"
        tests:
          - not_null
      - name: email
        description: "User email address (lowercase, trimmed)"
        tests:
          - not_null
          - unique
      - name: company
        description: "User company name (trimmed)"
      - name: plan_type
        description: "User subscription plan type (standardized)"
        tests:
          - not_null
          - accepted_values:
              values: ['Free', 'Pro', 'Business', 'Enterprise']
      - name: load_timestamp
        description: "Original load timestamp from bronze"
      - name: update_timestamp
        description: "Original update timestamp from bronze"
      - name: source_system
        description: "Source system identifier"
        tests:
          - not_null
      - name: load_date
        description: "Load date derived from timestamp"
        tests:
          - not_null
      - name: update_date
        description: "Update date derived from timestamp"
        tests:
          - not_null
      - name: data_quality_score
        description: "Data quality score (0.0 to 1.0)"
        tests:
          - not_null
      - name: record_status
        description: "Record status (active/error)"
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'error']

  - name: si_meetings
    description: "Silver layer meetings table with cleaned and validated data"
    columns:
      - name: meeting_id
        description: "Unique identifier for meetings"
