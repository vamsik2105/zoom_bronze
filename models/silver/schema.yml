version: 2

models:
  - name: si_process_audit
    description: "Process audit table for ETL monitoring"
    columns:
      - name: execution_id
        description: "Unique execution identifier"
        tests:
          - unique
          - not_null
      - name: pipeline_name
        description: "Name of the pipeline"
      - name: status
        description: "Execution status"

  - name: si_data_quality_errors
    description: "Data quality errors tracking"
    columns:
      - name: error_id
        description: "Unique error identifier"
        tests:
          - unique
          - not_null
      - name: source_table
        description: "Source table with error"

  - name: si_users
    description: "Silver layer users"
    columns:
      - name: user_id
        description: "Unique user identifier"
        tests:
          - unique
          - not_null
      - name: email
        description: "User email address"
      - name: plan_type
        description: "User plan type"
        tests:
          - accepted_values:
              values: ['Free', 'Pro', 'Business', 'Enterprise']
      - name: data_quality_score
        description: "Data quality score (0.0-1.0)"
      - name: record_status
        description: "Record status"
        tests:
          - accepted_values:
              values: ['active', 'error']

  - name: si_meetings
    description: "Silver layer meetings"
    columns:
      - name: meeting_id
        description: "Unique meeting identifier"
        tests:
          - unique
          - not_null
      - name: host_id
        description: "Meeting host user ID"
      - name: duration_minutes
        description: "Meeting duration in minutes"
      - name: data_quality_score
        description: "Data quality score"
      - name: record_status
        description: "Record status"
        tests:
          - accepted_values:
              values: ['active', 'error']
