version: 2

sources:
  - name: silver
    description: "Silver layer containing cleaned and standardized data"
    tables:
      - name: si_users
        description: "Silver users table with user information"
        columns:
          - name: user_id
            description: "Unique identifier for users"
          - name: user_name
            description: "User display name"
          - name: email
            description: "User email address"
          - name: company
            description: "User company/organization"
          - name: plan_type
            description: "User subscription plan type"
          - name: record_status
            description: "Record status indicator"

      - name: si_meetings
        description: "Silver meetings table with meeting information"
        columns:
          - name: meeting_id
            description: "Unique identifier for meetings"
          - name: host_id
            description: "Meeting host user ID"
          - name: meeting_topic
            description: "Meeting topic/title"
          - name: start_time
            description: "Meeting start timestamp"
          - name: duration_minutes
            description: "Meeting duration in minutes"

      - name: si_participants
        description: "Silver participants table with participation data"
        columns:
          - name: participant_id
            description: "Unique identifier for participants"
          - name: meeting_id
            description: "Associated meeting ID"
          - name: user_id
            description: "Participant user ID"
          - name: join_time
            description: "Participant join timestamp"
          - name: leave_time
            description: "Participant leave timestamp"

      - name: si_feature_usage
        description: "Silver feature usage table"
        columns:
          - name: usage_id
            description: "Unique identifier for usage records"
          - name: meeting_id
            description: "Associated meeting ID"
          - name: feature_name
            description: "Name of the feature used"
          - name: usage_count
            description: "Number of times feature was used"

      - name: si_webinars
        description: "Silver webinars table"
        columns:
          - name: webinar_id
            description: "Unique identifier for webinars"
          - name: host_id
            description: "Webinar host user ID"
          - name: webinar_topic
            description: "Webinar topic/title"

      - name: si_support_tickets
        description: "Silver support tickets table"
        columns:
          - name: ticket_id
            description: "Unique identifier for support tickets"
          - name: user_id
            description: "User who created the ticket"
          - name: ticket_type
            description: "Type of support ticket"

      - name: si_licenses
        description: "Silver licenses table"
        columns:
          - name: license_id
            description: "Unique identifier for licenses"
          - name: license_type
            description: "Type of license"
          - name: assigned_to_user_id
            description: "User assigned to the license"

      - name: si_billing_events
        description: "Silver billing events table"
        columns:
          - name: event_id
            description: "Unique identifier for billing events"
          - name: user_id
            description: "User associated with billing event"
          - name: event_type
            description: "Type of billing event"
          - name: amount
            description: "Billing amount"

models:
  - name: go_process_audit
    description: "Gold layer process audit table for tracking ETL processes"
    columns:
      - name: execution_id
        description: "Unique identifier for each execution"
      - name: pipeline_name
        description: "Name of the pipeline being executed"
      - name: process_type
        description: "Type of process (DBT_RUN, etc.)"
      - name: start_time
        description: "Process start timestamp"
      - name: end_time
        description: "Process end timestamp"
      - name: status
        description: "Process execution status"

  - name: go_daily_meeting_summary
    description: "Daily aggregated meeting metrics by organization"
    columns:
      - name: summary_id
        description: "Unique identifier for daily summary"
      - name: summary_date
        description: "Date of the summary"
      - name: organization_id
        description: "Organization identifier"
      - name: total_meetings
        description: "Total number of meetings"
      - name: total_meeting_minutes
        description: "Total meeting duration in minutes"
      - name: average_meeting_duration
        description: "Average meeting duration"

  - name: go_monthly_user_activity
    description: "Monthly user activity aggregations"
    columns:
      - name: activity_id
        description: "Unique identifier for activity record"
      - name: activity_month
        description: "Month of activity"
      - name: user_id
        description: "User identifier"
      - name: meetings_hosted
        description: "Number of meetings hosted"
      - name: meetings_attended
        description: "Number of meetings attended"

  - name: go_feature_adoption_summary
    description: "Feature adoption metrics by organization"
    columns:
      - name: adoption_id
        description: "Unique identifier for adoption record"
      - name: summary_period
        description: "Summary period (month)"
      - name: feature_name
        description: "Name of the feature"
      - name: total_usage_count
        description: "Total usage count for the feature"
      - name: adoption_rate
        description: "Feature adoption rate percentage"

  - name: go_quality_metrics_summary
    description: "Quality metrics summary by date and organization"
    columns:
      - name: quality_summary_id
        description: "Unique identifier for quality summary"
      - name: summary_date
        description: "Date of the summary"
      - name: total_sessions
        description: "Total number of sessions"
      - name: average_audio_quality
        description: "Average audio quality score"
      - name: connection_success_rate
        description: "Connection success rate percentage"

  - name: go_engagement_summary
    description: "Engagement metrics summary"
    columns:
      - name: engagement_id
        description: "Unique identifier for engagement record"
      - name: summary_date
        description: "Date of the summary"
      - name: total_meetings
        description: "Total number of meetings"
      - name: average_participation_rate
        description: "Average participation rate percentage"
      - name: total_chat_messages
        description: "Total chat messages sent"

  - name: vw_meeting_analytics
    description: "Meeting analytics view for reporting"
    columns:
      - name: meeting_id
        description: "Unique meeting identifier"
      - name: meeting_topic
        description: "Meeting topic"
      - name: host_name
        description: "Meeting host name"
      - name: engagement_score
        description: "Meeting engagement score"

  - name: vw_user_activity
    description: "User activity view for reporting"
    columns:
      - name: user_id
        description: "User identifier"
      - name: user_name
        description: "User name"
      - name: meetings_hosted
        description: "Number of meetings hosted"
      - name: meetings_attended
        description: "Number of meetings attended"

  - name: vw_quality_dashboard
    description: "Quality dashboard view for monitoring"
    columns:
      - name: summary_date
        description: "Summary date"
      - name: organization_name
        description: "Organization name"
      - name: total_sessions
        description: "Total sessions"
      - name: average_audio_quality
        description: "Average audio quality"
      - name: connection_success_rate
        description: "Connection success rate"
