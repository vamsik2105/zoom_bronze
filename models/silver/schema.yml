version: 2

sources:
  - name: bronze
    description: "Bronze layer containing raw data from source systems"
    tables:
      - name: bz_users
        description: "Raw user data from Zoom system"
        columns:
          - name: user_id
            description: "Unique identifier for user"
            tests:
              - not_null
              - unique
          - name: user_name
            description: "User display name"
          - name: email
            description: "User email address"
          - name: company
            description: "User company name"
          - name: plan_type
            description: "User subscription plan type"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"
            
      - name: bz_meetings
        description: "Raw meeting data from Zoom system"
        columns:
          - name: meeting_id
            description: "Unique identifier for meeting"
            tests:
              - not_null
              - unique
          - name: host_id
            description: "User ID of meeting host"
          - name: meeting_topic
            description: "Meeting topic/title"
          - name: start_time
            description: "Meeting start timestamp"
          - name: end_time
            description: "Meeting end timestamp"
          - name: duration_minutes
            description: "Meeting duration in minutes"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"
            
      - name: bz_participants
        description: "Raw participant data from Zoom system"
        columns:
          - name: participant_id
            description: "Unique identifier for participant"
            tests:
              - not_null
              - unique
          - name: meeting_id
            description: "Meeting identifier"
          - name: user_id
            description: "User identifier"
          - name: join_time
            description: "Participant join timestamp"
          - name: leave_time
            description: "Participant leave timestamp"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"
            
      - name: bz_feature_usage
        description: "Raw feature usage data from Zoom system"
        columns:
          - name: usage_id
            description: "Unique identifier for usage record"
            tests:
              - not_null
              - unique
          - name: meeting_id
            description: "Meeting identifier"
          - name: feature_name
            description: "Name of feature used"
          - name: usage_count
            description: "Number of times feature was used"
          - name: usage_date
            description: "Date of feature usage"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"
            
      - name: bz_webinars
        description: "Raw webinar data from Zoom system"
        columns:
          - name: webinar_id
            description: "Unique identifier for webinar"
            tests:
              - not_null
              - unique
          - name: host_id
            description: "User ID of webinar host"
          - name: webinar_topic
            description: "Webinar topic/title"
          - name: start_time
            description: "Webinar start timestamp"
          - name: end_time
            description: "Webinar end timestamp"
          - name: registrants
            description: "Number of webinar registrants"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"
            
      - name: bz_support_tickets
        description: "Raw support ticket data from Zoom system"
        columns:
          - name: ticket_id
            description: "Unique identifier for support ticket"
            tests:
              - not_null
              - unique
          - name: user_id
            description: "User identifier who created ticket"
          - name: ticket_type
            description: "Type/category of support ticket"
          - name: resolution_status
            description: "Current status of ticket resolution"
          - name: open_date
            description: "Date when ticket was opened"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"
            
      - name: bz_licenses
        description: "Raw license data from Zoom system"
        columns:
          - name: license_id
            description: "Unique identifier for license"
            tests:
              - not_null
              - unique
          - name: license_type
            description: "Type of license"
          - name: assigned_to_user_id
            description: "User ID license is assigned to"
          - name: start_date
            description: "License start date"
          - name: end_date
            description: "License end date"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"
            
      - name: bz_billing_events
        description: "Raw billing event data from Zoom system"
        columns:
          - name: event_id
            description: "Unique identifier for billing event"
            tests:
              - not_null
              - unique
          - name: user_id
            description: "User identifier for billing event"
          - name: event_type
            description: "Type of billing event"
          - name: amount
            description: "Billing amount"
          - name: event_date
            description: "Date of billing event"
          - name: load_timestamp
            description: "Timestamp when record was loaded"
          - name: update_timestamp
            description: "Timestamp when record was last updated"
          - name: source_system
            description: "Source system identifier"

models:
  - name: si_process_audit
    description: "Process audit table tracking ETL execution metrics"
    columns:
      - name: execution_id
        description: "Unique identifier for execution"
        tests:
          - not_null
          - unique
      - name: pipeline_name
        description: "Name of the ETL pipeline"
        tests:
          - not_null
      - name: start_time
        description: "Pipeline execution start time"
        tests:
          - not_null
      - name: status
        description: "Execution status (SUCCESS/FAILURE/RUNNING)"
        tests:
          - not_null
          - accepted_values:
              values: ['SUCCESS', 'FAILURE', 'RUNNING']
              
  - name: si_data_quality_errors
    description: "Data quality errors tracking table"
    columns:
      - name: error_id
        description: "Unique identifier for error"
        tests:
          - not_null
          - unique
      - name: source_table
        description: "Source table where error occurred"
        tests:
          - not_null
      - name: error_type
        description: "Type of data quality error"
        tests:
          - not_null
      - name: severity_level
        description: "Severity level of the error"
        tests:
          - accepted_values:
              values: ['LOW', 'MEDIUM', 'HIGH', 'CRITICAL']
      - name: resolution_status
        description: "Status of error resolution"
        tests:
          - accepted_values:
              values: ['OPEN', 'IN_PROGRESS', 'RESOLVED', 'CLOSED']
              
  - name: si_users
    description: "Silver layer users with data quality validations"
    columns:
      - name: user_id
        description: "Unique identifier for user"
        tests:
          - not_null
          - unique
      - name: user_name
        description: "User display name"
        tests:
          - not_null
      - name: email
        description: "User email address"
        tests:
          - not_null
          - unique
      - name: plan_type
        description: "User subscription plan type"
        tests:
          - not_null
          - accepted_values:
              values: ['FREE', 'PRO', 'BUSINESS', 'ENTERPRISE']
      - name: load_timestamp
        description: "Timestamp when record was loaded"
        tests:
          - not_null
      - name: update_timestamp
        description: "Timestamp when record was last updated"
        tests:
          - not_null
      - name: source_system
        description: "Source system identifier"
        tests:
          - not_null
      - name: load_date
        description: "Date when record was loaded"
        tests:
          - not_null
      - name: update_date
        description: "Date when record was last updated"
        tests:
          - not_null
      - name: data_quality_score
        description: "Data quality score (0-1)"
        tests:
          - not_null
      - name: record_status
        description: "Record status (ACTIVE/ERROR)"
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'error']
